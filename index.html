      body(c, lgrad(c, 0, -0.4, 0, 0.4, ['#f0dfb4', '#cfb27a', '#a98b52']), [-1.1, -0.4, 2.2, 0.8], 0.3);
      c.save(); rr(c, -1.1, -0.4, 2.2, 0.8, 0.3); c.clip();
      [[-0.6, '#7a3b10'], [-0.25, '#111'], [0.1, '#c0392b'], [0.7, '#d4af37']].forEach(([x, col]) => { c.fillStyle = col; c.fillRect(x, -0.4, 0.18, 0.8); });
      c.fillStyle = 'rgba(255,255,255,.28)'; c.fillRect(-1.1, -0.36, 2.2, 0.2);
      c.restore();
    }
    return;
  }

  if (k === 'capacitor') {
    if (t === 'electrolytic') {
      legs(c, p, { r: [-1.4, -0.9, 2.8, 1.8] });
      body(c, lgrad(c, 0, -0.9, 0, 0.9, ['#5b8fe0', '#2552a8', '#16346e']), [-1.4, -0.9, 2.8, 1.8], 0.25);
      c.save(); rr(c, -1.4, -0.9, 2.8, 1.8, 0.25); c.clip();
      c.fillStyle = lgrad(c, 0, -0.9, 0, 0.9, ['#ffffff', '#cfd6e3', '#9aa5b8']); c.fillRect(0.8, -0.9, 0.6, 1.8);
      c.restore();
      txt(c, '\u2212', 1.1, 0, 0.8, 'center', '#1b2a3b'); txt(c, '+', -1, 0, 0.8, 'center', '#fff');
    } else if (t === 'tantalum') {
      legs(c, p, { c: [0, 0, 0.9] });
      c.beginPath(); c.ellipse(0, 0, 1, 0.85, 0, 0, Math.PI * 2);
      c.fillStyle = rgrad(c, -0.3, -0.3, 0.1, 1.1, ['#f3c25b', '#d68f1e', '#8a560a']); c.fill();
      c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 0.06; c.stroke();
      txt(c, '+', -0.55, 0, 0.7, 'center', '#3a2504');
    } else if (t === 'variable') {
      legs(c, p, { r: [-0.9, -0.9, 1.8, 1.8] });
      body(c, lgrad(c, 0, -0.9, 0, 0.9, ['#6aa8ea', '#2f6fba', '#1f4f8c']), [-0.9, -0.9, 1.8, 1.8], 0.2);
      disc(c, 0, 0, 0.5, ['#f3f4f6', '#b8bec7', '#7d8591']);
      c.strokeStyle = '#374151'; c.lineWidth = 0.12; L(c, [-0.3, 0, 0.3, 0]);
    } else {
      legs(c, p, { c: [0, 0, 0.85] });
      disc(c, 0, 0, 0.85, ['#f6c971', '#e19a2d', '#a86a12']);
      shine(c, -0.3, -0.35, 0.3, 0.17);
    }
    return;
  }

  if (k === 'diode') {
    legs(c, p, { r: [-1, -0.5, 2, 1] });
    const glass = t === 'zener';
    body(c, glass ? lgrad(c, 0, -0.5, 0, 0.5, ['#f0b46b', '#c9772a', '#8a4a10'])
      : lgrad(c, 0, -0.5, 0, 0.5, ['#5a5a5a', '#1a1a1a', '#050505']), [-1, -0.5, 2, 1], 0.28);
    c.fillStyle = glass ? '#111' : '#d5dae1'; c.fillRect(0.45, -0.5, 0.28, 1);
    c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(-0.9, -0.42, 1.2, 0.16);
    return;
  }

  if (k === 'led') {
    const std = t === 'standard';
    if (isActive(p)) glow(c, 0, 0, 2.4, std ? '255,70,70' : '255,255,255');
    legs(c, p, { c: [0, 0, 0.95] });
    disc(c, 0, 0, 0.95, std ? ['#ffb3b3', '#e5252a', '#8f0f13'] : ['#ffffff', '#e6e9ee', '#aab2bd']);
    c.fillStyle = 'rgba(0,0,0,.22)'; c.fillRect(0.72, -0.8, 0.28, 1.6);
    shine(c, -0.3, -0.4, 0.28, 0.16);
    return;
  }

  if (k === 'dc') {
    if (t === 'supply') {
      legs(c, p, { r: [-1, -1, 2, 2] });
      body(c, lgrad(c, 0, -1, 0, 1, ['#555d68', '#2b2f36', '#14171b']), [-1, -1, 2, 2], 0.25);
      txt(c, 'DC', 0, 0, 0.8, 'center', '#fff');
    } else {
      legs(c, p, { r: [-1.7, -0.75, 3.4, 1.5] });
      body(c, lgrad(c, 0, -0.75, 0, 0.75, ['#4b5563', '#1f2937', '#0b1018']), [-1.7, -0.75, 3.4, 1.5], 0.3);
      c.save(); rr(c, -1.7, -0.75, 3.4, 1.5, 0.3); c.clip();
      c.fillStyle = lgrad(c, 0, -0.75, 0, 0.75, ['#fcd34d', '#d97706', '#92400e']); c.fillRect(-0.7, -0.75, 1.9, 1.5);
      c.restore();
      c.fillStyle = '#c3cad4'; rr(c, -1.95, -0.3, 0.35, 0.6, 0.1); c.fill();
      txt(c, '+', -1.2, 0, 0.7, 'center', '#fff');
      txt(c, p.value, 0.25, 0, 0.55, 'center', '#3a1f05');
    }
    return;
  }

  if (k === 'ac') {
    legs(c, p, { r: [-1, -1, 2, 2] });
    body(c, lgrad(c, 0, -1, 0, 1, ['#fafafa', '#d9dde3', '#aab1bc']), [-1, -1, 2, 2], 0.3);
    txt(c, 'AC', 0, 0, 0.85, 'center', '#1b2a3b');
    return;
  }

  if (k === 'transformer') {
    legs(c, p, { r: [-1.5, -1.7, 3, 3.4] });
    body(c, lgrad(c, -1.5, 0, 1.5, 0, ['#5b6573', '#2a313b', '#14181e']), [-1.5, -1.7, 3, 3.4], 0.25);
    c.fillStyle = lgrad(c, 0, -1.4, 0, 1.4, ['#f0a868', '#c06a2a', '#7c3d10']);
    c.fillRect(-1.3, -1.4, 0.7, 2.8); c.fillRect(0.6, -1.4, 0.7, 2.8);
    c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 0.08;
    for (let i = -3; i <= 3; i++) L(c, [-0.3, i * 0.4, 0.3, i * 0.4]);
    return;
  }

  if (k === 'regulator') {
    legs(c, p, { r: [-1.5, -0.7, 3, 1.9] });
    body(c, lgrad(c, 0, -1.7, 0, -0.7, ['#e5e7eb', '#a7aeb9', '#7b8390']), [-1.5, -1.7, 3, 1.1], 0.15);
    disc(c, 0, -1.2, 0.28, ['#1f2937', '#0b0f14']);
    body(c, lgrad(c, 0, -0.7, 0, 1.2, ['#3b3f46', '#16181c', '#050607']), [-1.5, -0.7, 3, 1.9], 0.15);
    txt(c, p.value, 0, 0.3, 0.75, 'center', '#e5e7eb');
    return;
  }

  if (k === 'bulb') {
    if (isActive(p)) glow(c, 0, 0, 2.8, '255,214,60');
    legs(c, p, { c: [0, 0, 1.05] });
    disc(c, 0, 0, 1.05, ['#fffbe0', '#ffe27a', '#d9a900']);
    c.strokeStyle = '#6b4e00'; c.lineWidth = 0.1;
    L(c, [-0.6, 0.3, -0.35, -0.3, -0.1, 0.3, 0.15, -0.3, 0.4, 0.3, 0.6, -0.1]);
    shine(c, -0.4, -0.55, 0.3, 0.16);
    return;
  }

  if (k === 'motor') {
    legs(c, p, { c: [0, 0, 1.3] });
    disc(c, 0, 0, 1.3, ['#f3f4f6', '#a3abb7', '#5f6773']);
    disc(c, 0, 0, 0.45, ['#6b7280', '#374151', '#1f2937']);
    c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 0.07;
    c.beginPath(); c.arc(0, 0, 0.95, 0, Math.PI * 2); c.stroke();
    if (isActive(p)) {
      c.save(); c.rotate(animT * 0.009);
      c.strokeStyle = '#f9fafb'; c.lineWidth = 0.14;
      L(c, [-0.9, 0, 0.9, 0]); L(c, [0, -0.9, 0, 0.9]);
      c.restore();
    } else txt(c, 'M', 0, 0.02, 0.7, 'center', '#fff');
    return;
  }

  if (k === 'inductor') {
    legs(c, p, { r: [-1.5, -0.8, 3, 1.6] });
    if (t === 'iron') body(c, lgrad(c, 0, -0.8, 0, 0.8, ['#6b7280', '#2f353d', '#14171b']), [-1.5, -0.8, 3, 1.6], 0.7);
    else body(c, lgrad(c, 0, -0.8, 0, 0.8, ['#f0a868', '#c06a2a', '#7c3d10']), [-1.5, -0.8, 3, 1.6], 0.7);
    c.strokeStyle = t === 'iron' ? '#d97706' : 'rgba(60,25,5,.55)'; c.lineWidth = 0.1;
    for (let i = -4; i <= 4; i++) L(c, [i * 0.28, -0.75, i * 0.28 + 0.12, 0.75]);
    if (t === 'variable') { c.strokeStyle = '#fff'; c.lineWidth = 0.12; L(c, [-1, 1.1, 1, -1.1]); }
    return;
  }

  if (k === 'relay') {
    legs(c, p, { r: [-2.5, -2, 5, 4] });
    body(c, lgrad(c, 0, -2, 0, 2, ['#4f8fe0', '#1d4ed8', '#1b2f7a']), [-2.5, -2, 5, 4], 0.3);
    txt(c, 'RELAY', 0, -0.35, 0.8, 'center', '#fff');
    txt(c, p.value, 0, 0.5, 0.65, 'center', '#dbe7ff');
    if (isActive(p)) {
      c.save();
      c.strokeStyle = 'rgba(250,204,21,' + (0.55 + 0.35 * Math.sin(animT / 140)) + ')'; c.lineWidth = 0.2;
      rr(c, -2.5, -2, 5, 4, 0.3); c.stroke();
      c.restore();
    }
    return;
  }

  if (k === 'ic') {
    const b = getBox(k, t);
    const rect = [b[0], b[1], b[2] - b[0], b[3] - b[1]];
    legs(c, p, { r: rect });
    body(c, lgrad(c, b[0], 0, b[2], 0, ['#3a3a3a', '#141414', '#050505']), rect, 0.2);
    if (t === '555' || t === 'dip') {
      c.fillStyle = '#2a2a2a'; c.beginPath(); c.arc(0, b[1], 0.55, 0, Math.PI); c.fill();
      c.fillStyle = '#8a8a8a'; c.beginPath(); c.arc(b[0] + 0.5, b[1] + 0.6, 0.18, 0, Math.PI * 2); c.fill();
    }
    txt(c, p.value, 0, 0, t === '555' || t === 'dip' ? 0.8 : 0.7, 'center', '#d4d4d4');
    return;
  }

  if (k === 'switch') {
    const on = isOn(p);
    if (t === 'push') {
      legs(c, p, { r: [-1, -1, 2, 2] });
      body(c, lgrad(c, 0, -1, 0, 1, ['#555d68', '#2b2f36', '#14171b']), [-1, -1, 2, 2], 0.25);
      disc(c, 0, on ? 0.05 : -0.08, 0.55, ['#ff9a9a', '#d62828', '#8f1414']);
    } else {
      const r = t === 'spdt' ? [-1, -1.3, 2, 2.6] : [-1, -0.8, 2, 1.6];
      legs(c, p, { r });
      body(c, lgrad(c, 0, r[1], 0, r[1] + r[3], ['#c9ced6', '#8d95a1', '#5a6270']), r, 0.2);
      c.save();
      c.rotate(on ? 0.45 : -0.45);
      c.strokeStyle = '#e5e7eb'; c.lineWidth = 0.32; L(c, [0, 0, 0, -1.5]);
      c.strokeStyle = '#6b7280'; c.lineWidth = 0.12; L(c, [0.1, 0, 0.1, -1.5]);
      disc(c, 0, -1.55, 0.28, ['#ffffff', '#cfd4dc', '#8a92a0']);
      c.restore();
    }
    return;
  }

  if (k === 'note') {
    txt(c, p.value || '', 0, 0, 0.85, 'center', '#ffffff');
    return;
  }

  if (k === 'transistor') {
    legs(c, p, { c: [0.2, 0, 1.2] });
    disc(c, 0.2, 0, 1.2, ['#4b4b4b', '#1b1b1b', '#050505']);
    c.fillStyle = 'rgba(255,255,255,.14)'; c.fillRect(-0.9, -0.9, 0.25, 1.8);
    txt(c, t === 'npn' ? 'NPN' : t === 'pnp' ? 'PNP' : t === 'nmos' ? 'N-MOS' : 'P-MOS', 0.35, 0, 0.5, 'center', '#e5e7eb');
  }
}

/* =====================================================================
   Rendering
   ===================================================================== */
const HIT_PX = () => (window.innerWidth < 600 ? 30 : 24);

function resize() {
  const rect = canvas.getBoundingClientRect();
  W = rect.width; H = rect.height;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(W * dpr));
  canvas.height = Math.max(1, Math.round(H * dpr));
  render();
}

function dotAlpha() {
  if (view.zoom <= FADE_OUT_AT) return 0;
  if (view.zoom >= FADE_IN_AT) return 1;
  return (view.zoom - FADE_OUT_AT) / (FADE_IN_AT - FADE_OUT_AT);
}

function drawDots(pcb) {
  const a = dotAlpha();
  if (a <= 0) return;
  const sp = G * view.zoom;
  const r = clamp(1.5 * view.zoom, 1, 2.4);
  const sx = ((view.x % sp) + sp) % sp, sy = ((view.y % sp) + sp) % sp;
  ctx.globalAlpha = a;
  ctx.fillStyle = pcb ? '#2c6b42' : '#98a6b6';
  ctx.beginPath();
  for (let x = sx; x < W; x += sp) {
    for (let y = sy; y < H; y += sp) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); }
  }
  ctx.fill();
  ctx.globalAlpha = 1;
}

function labelDir(p, t) {
  const b = partBounds(p);
  const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  const r = ft(p, t.x, t.y);
  const dx = p.x + r[0] - cx, dy = p.y + r[1] - cy;
  if (Math.abs(dx) >= Math.abs(dy)) return dx >= 0 ? 'r' : 'l';
  return dy >= 0 ? 'd' : 'u';
}

function connectedSet() {
  const s = new Set();
  project.wires.forEach((w) => [w.a, w.b].forEach((e) => { if (e.j === undefined) s.add(e.p + ':' + e.t); }));
  return s;
}

function unconnectedList() {
  const conn = connectedSet(), out = [];
  project.parts.forEach((p) => getTerms(p.kind, p.type).forEach((t, i) => {
    if (!conn.has(p.id + ':' + i)) out.push(termWorld(p, i));
  }));
  return out;
}

/* Board: it starts screen sized and grows when parts get near its edge */
function ensureBoard() {
  if (!project.board) {
    const gw = Math.max(12, 2 * Math.floor((W - 24) / G / 2)), gh = Math.max(16, 2 * Math.floor((H - 24) / G / 2));
    project.board = { x0: -gw / 2, y0: -gh / 2, x1: gw / 2, y1: gh / 2 };
  }
  const b = project.board, m = 3;
  project.parts.forEach((p) => {
    const q = partBounds(p);
    b.x0 = Math.min(b.x0, Math.floor(q.x0) - m); b.y0 = Math.min(b.y0, Math.floor(q.y0) - m);
    b.x1 = Math.max(b.x1, Math.ceil(q.x1) + m); b.y1 = Math.max(b.y1, Math.ceil(q.y1) + m);
  });
}

// The board also grows to hold every wire
function growBoardToRoutes() {
  const b = project.board;
  routes.forEach((pts) => pts.forEach((q) => {
    b.x0 = Math.min(b.x0, Math.floor(q.x / G) - 1); b.y0 = Math.min(b.y0, Math.floor(q.y / G) - 1);
    b.x1 = Math.max(b.x1, Math.ceil(q.x / G) + 1); b.y1 = Math.max(b.y1, Math.ceil(q.y / G) + 1);
  }));
}

// Keeps the board on screen: panning stops at the board edge plus a small margin
function clampView() {
  if (!project || !project.board || !W) return;
  const b = project.board, z = view.zoom, m = 28;
  const bw = (b.x1 - b.x0) * G * z, bh = (b.y1 - b.y0) * G * z;
  if (bw + 2 * m <= W) view.x = (W - bw) / 2 - b.x0 * G * z;
  else view.x = clamp(view.x, W - m - b.x1 * G * z, m - b.x0 * G * z);
  if (bh + 2 * m <= H) view.y = (H - bh) / 2 - b.y0 * G * z;
  else view.y = clamp(view.y, H - m - b.y1 * G * z, m - b.y0 * G * z);
}

function drawBoard(pcb) {
  const b = project.board, z = view.zoom;
  const x = b.x0 * G * z + view.x, y = b.y0 * G * z + view.y;
  const w = (b.x1 - b.x0) * G * z, h = (b.y1 - b.y0) * G * z;
  const r = Math.min(18, 0.6 * G * z);
  ctx.save();
  rr(ctx, x, y, w, h, r);
  ctx.fillStyle = pcb ? '#3f8f5a' : '#eef2f6'; ctx.fill();
  ctx.save(); ctx.clip(); drawDots(pcb); ctx.restore();
  ctx.lineJoin = 'round';
  rr(ctx, x, y, w, h, r);
  ctx.lineWidth = pcb ? 6 : 3; ctx.strokeStyle = pcb ? '#2a6a40' : '#6b7b8e'; ctx.stroke();
  if (pcb) {
    const i = 0.55 * G * z;
    rr(ctx, x + i, y + i, w - 2 * i, h - 2 * i, Math.max(2, r - 4));
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.stroke();
    const hr = Math.max(4, 0.28 * G * z), hi = 1.4 * G * z;
    [[x + hi, y + hi], [x + w - hi, y + hi], [x + hi, y + h - hi], [x + w - hi, y + h - hi]].forEach(([cx, cy]) => {
      ctx.beginPath(); ctx.arc(cx, cy, hr, 0, Math.PI * 2);
      ctx.fillStyle = '#10161c'; ctx.fill();
      ctx.lineWidth = Math.max(2, hr * 0.35); ctx.strokeStyle = '#d9b94a'; ctx.stroke();
    });
  }
  ctx.restore();
}

function drawArrows(z) {
  const k = flow.ac ? (Math.floor(animT / 250) % 2) : 0;      // AC reverses 4 times every second
  const sz = Math.max(7, 8 * z) / z;
  ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#6b4f00'; ctx.lineWidth = 1 / z;
  flow.phases[k].forEach((dir, id) => {
    if (!dir) return;
    const s = flow.segs[id];
    if (!s) return;
    let pts = subPath(routeWire(s.w), s.d0, s.d1);
    if (dir < 0) pts = pts.slice().reverse();
    const len = pathLen(pts);
    if (len < 6) return;
    const n = Math.max(1, Math.round(len / (1.6 * G)));
    const sp = len / n, off = ((animT / 1000) * 70) % sp;
    for (let i = 0; i < n; i++) {
      const dd = off + i * sp;
      const q = pointAtDist(pts, dd), u = segDirAt(pts, dd);
      ctx.beginPath();
      ctx.moveTo(q.x + u[0] * sz, q.y + u[1] * sz);
      ctx.lineTo(q.x - u[0] * sz * 0.6 - u[1] * sz * 0.65, q.y - u[1] * sz * 0.6 + u[0] * sz * 0.65);
      ctx.lineTo(q.x - u[0] * sz * 0.6 + u[1] * sz * 0.65, q.y - u[1] * sz * 0.6 - u[0] * sz * 0.65);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  });
}

function render() {
  if (!project || !W) return;
  const dpr = renderDpr || window.devicePixelRatio || 1;
  const pcb = screenView === 'pcb';
  nets = computeNets();
  ensureRoutes(nets);
  if (!exporting) { ensureBoard(); growBoardToRoutes(); clampView(); }
  const z = view.zoom;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#10161c';
  ctx.fillRect(0, 0, W, H);
  drawBoard(pcb);

  if (flowDirty) { flow = computeFlow(nets); flowDirty = false; }
  ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * view.x, dpr * view.y);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  const lwWorld = Math.max(3.75, 4.8 * z) / z;               // symbols stay bold at every zoom
  const wireW = (pcb ? Math.max(6, 0.34 * G * z) : Math.max(3.5, 4.2 * z)) / z;

  // Wires (schematic: red / black / grey, PCB: copper traces)
  if (shortFlash) {
    ctx.strokeStyle = 'rgba(250,204,21,.8)'; ctx.lineWidth = wireW + 10 / z;
    project.wires.forEach((w) => { if (nets.shorts.has(nets.find(termKey(w.a)))) strokePath(ctx, routeWire(w)); });
  }
  if (selWire && !pcb) {
    const w = wireById(selWire.id);
    if (w) { ctx.strokeStyle = 'rgba(59,130,246,.55)'; ctx.lineWidth = wireW + 8 / z; strokePath(ctx, routeWire(w)); }
  }
  project.wires.forEach((w) => {
    const pts = routeWire(w);
    const hops = hopsByWire.get(w.id) || [];
    if (pcb) {
      ctx.strokeStyle = '#a8662c'; ctx.lineWidth = wireW; strokeTraceWithGaps(ctx, pts, hops);
      ctx.strokeStyle = '#d9985a'; ctx.lineWidth = wireW * 0.7; strokeTraceWithGaps(ctx, pts, hops);
      ctx.strokeStyle = '#f0c48a'; ctx.lineWidth = wireW * 0.22; strokeTraceWithGaps(ctx, pts, hops);
    } else {
      ctx.strokeStyle = wireColor(w); ctx.lineWidth = wireW;
      if (hops.length) strokeHopPath(ctx, pts, hops, 0.38 * G); else strokePath(ctx, pts);
    }
  });

  if (pcb) drawJumpers(ctx, z);
  else if (crossings.length) {
    // small gap in the wire underneath each hop, then the hopping wires are drawn again on top
    const hr = 0.38 * G;
    ctx.strokeStyle = '#eef2f6'; ctx.lineWidth = wireW + 6 / z;
    crossings.forEach((c) => {
      ctx.beginPath(); ctx.moveTo(c.x - c.ux * hr, c.y - c.uy * hr);
      if (c.ux > 0.5) ctx.arc(c.x, c.y, hr, Math.PI, 0, false);
      else if (c.ux < -0.5) ctx.arc(c.x, c.y, hr, 0, Math.PI, true);
      else if (c.uy > 0) ctx.arc(c.x, c.y, hr, -Math.PI / 2, Math.PI / 2, false);
      else ctx.arc(c.x, c.y, hr, Math.PI / 2, -Math.PI / 2, true);
      ctx.stroke();
    });
    project.wires.forEach((w) => {
      const hops = hopsByWire.get(w.id);
      if (!hops) return;
      ctx.strokeStyle = wireColor(w); ctx.lineWidth = wireW;
      strokeHopPath(ctx, routeWire(w), hops, hr);
    });
  }

  if (flow && flow.any) drawArrows(z);

  // Parts
  project.parts.forEach((p) => {
    if (p.id === selPart) {
      const b = partBounds(p);
      ctx.save();
      ctx.fillStyle = 'rgba(59,130,246,.10)'; ctx.strokeStyle = C.sel; ctx.lineWidth = 2 / z;
      ctx.setLineDash([6 / z, 4 / z]);
      ctx.beginPath(); ctx.rect(b.x0 * G, b.y0 * G, (b.x1 - b.x0) * G, (b.y1 - b.y0) * G);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(p.x * G, p.y * G);
    ctx.rotate(p.rot * Math.PI / 2);
    if (p.flip) ctx.scale(-1, 1);
    ctx.scale(G, G);
    curRot = p.rot; curFlip = !!p.flip;
    ctx.lineWidth = lwWorld / G;
    ctx.strokeStyle = INK; ctx.fillStyle = PAPER;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (pcb) drawReal(ctx, p); else drawSymbol(p);
    ctx.restore();
  });

  // Junction dots (always on a board dot)
  project.juncs.forEach((j) => {
    const w = wireById(j.w); if (!w) return;
    const pt = juncPos(j.id);
    ctx.fillStyle = pcb ? '#f0c48a' : wireColor(w);
    ctx.beginPath(); ctx.arc(pt.x, pt.y, Math.max(5, 6 * z) / z, 0, Math.PI * 2); ctx.fill();
  });

  // Terminals, pads, polarity and letter labels
  const tr = clamp(0.3 * G * z, 4.5, 8) / z;
  const conn = checkOn ? connectedSet() : null;
  const fs = clamp(0.55 * G * z, 10, 15) / z;
  project.parts.forEach((p) => {
    getTerms(p.kind, p.type).forEach((t, i) => {
      const pos = termWorld(p, i);
      const d = labelDir(p, t);
      const put = (str, color, outline) => {
        ctx.font = '800 ' + fs + 'px system-ui, sans-serif';
        ctx.textBaseline = 'middle';
        let tx = pos.x, ty = pos.y;
        if (d === 'l' || d === 'r') { ctx.textAlign = 'center'; tx += (d === 'l' ? -0.45 : 0.45) * G; ty -= 0.85 * G; }
        else { ctx.textAlign = 'left'; tx += 0.6 * G; }
        if (outline) { ctx.lineWidth = 3 / z; ctx.strokeStyle = outline; ctx.strokeText(str, tx, ty); }
        ctx.fillStyle = color; ctx.fillText(str, tx, ty);
      };
      if (pcb) {
        ctx.fillStyle = '#d9b94a'; ctx.beginPath(); ctx.arc(pos.x, pos.y, 0.36 * G, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3f2f08'; ctx.beginPath(); ctx.arc(pos.x, pos.y, 0.13 * G, 0, Math.PI * 2); ctx.fill();
        if (t.pol && z >= 0.6) put(t.pol === '+' ? '+' : '\u2212', '#ffffff', '#14351f');
        return;
      }
      const active = pendEnd && pendEnd.p === p.id && pendEnd.t === i;
      ctx.fillStyle = active ? C.green : C.blue;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5 / z;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, active ? tr * 1.8 : tr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (conn && !conn.has(p.id + ':' + i)) {
        ctx.strokeStyle = C.orange; ctx.lineWidth = 3 / z;
        ctx.beginPath(); ctx.arc(pos.x, pos.y, 15 / z, 0, Math.PI * 2); ctx.stroke();
      }
      if (t.l && z >= 0.6) put(t.l, INK, '#eef2f6');
    });
  });

  // Part names and values
  if (z >= 0.6) {
    const nf = clamp(0.5 * G * z, 10, 15) / z;
    project.parts.forEach((p) => {
      if (p.kind === 'note') return;
      const b = partBounds(p);
      const cx = (b.x0 + b.x1) / 2 * G, y = (b.y1 + 0.9) * G;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 ' + nf + 'px system-ui, sans-serif';
      ctx.fillStyle = pcb ? '#ffffff' : INK;
      ctx.fillText(p.label, cx, y);
      ctx.font = '500 ' + (nf * 0.9) + 'px system-ui, sans-serif';
      ctx.fillStyle = pcb ? '#d9f2e2' : '#4a5b6e';
      ctx.fillText(p.value, cx, y + nf * 1.25);
    });
  }

  if (!exporting) {
    syncOverlays();
    if (flow && flow.any && !animRunning) startAnim();
  }
}

/* =====================================================================
   Animation (only runs while current flows; pauses while the board is touched)
   ===================================================================== */
function startAnim() {
  if (animRunning) return;
  animRunning = true;
  requestAnimationFrame(tick);
}
function tick(ts) {
  animT = ts;
  const editorOn = $('#editor').classList.contains('on');
  if (!flow || !flow.any || document.hidden || !project || !editorOn) { animRunning = false; return; }
  if (ptrs.size === 0 && !exporting) render();
  requestAnimationFrame(tick);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && project) render(); });

function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* not supported */ } }

/* =====================================================================
   Overlays: banners, hint, buttons, checks
   ===================================================================== */
const shortBanner = document.createElement('div');
shortBanner.className = 'banner short';
const checkBanner = document.createElement('div');
checkBanner.className = 'banner check';
$('#banners').append(shortBanner, checkBanner);

function contentBounds() {
  const list = project.parts;
  if (!list.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  list.forEach((p) => {
    const b = partBounds(p);
    x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0); x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1);
  });
  return { x0: x0 * G, y0: y0 * G, x1: x1 * G, y1: y1 * G };
}

function checkMessages() {
  const msgs = [];
  const n = unconnectedList().length;
  if (n) msgs.push(n + (n === 1 ? ' unconnected terminal' : ' unconnected terminals'));
  const real = project.parts.filter((p) => p.kind !== 'note');
  if (real.length && !real.some((p) => p.kind === 'dc' || p.kind === 'ac')) msgs.push('No source in the circuit');
  const conn = connectedSet();
  real.forEach((p) => {
    if (p.kind === 'dc' || p.kind === 'ac') {
      if (conn.has(p.id + ':0') !== conn.has(p.id + ':1')) msgs.push(p.label + ' has only one wire');
    }
    if (p.kind === 'capacitor' && (p.type === 'electrolytic' || p.type === 'tantalum') && nets) {
      const rp = nets.find('p' + p.id + ':0'), rm = nets.find('p' + p.id + ':1');
      const back = (nets.extMinus.has(rp) && !nets.extPlus.has(rp)) || (nets.extPlus.has(rm) && !nets.extMinus.has(rm));
      if (back) msgs.push(p.label + ' is connected backwards');
      else if (flow && isActive(p)) msgs.push(p.label + ' is polarized, not for AC');
    }
  });
  if (flow) flow.ledWarn.forEach((id) => { const p = partById(id); if (p) msgs.push(p.label + ' may burn out (no resistor)'); });
  const wn = (id) => 'Wire ' + (project.wires.findIndex((w) => w.id === id) + 1);
  crossings.slice(0, 4).forEach((c) => msgs.push(wn(c.hop) + ' crosses ' + wn(c.other) + ' (needs a jumper)'));
  if (crossings.length > 4) msgs.push('and ' + (crossings.length - 4) + ' more crossings');
  return msgs;
}

function syncOverlays() {
  const pcb = screenView === 'pcb';
  const sc = nets ? nets.shorts.size : 0;
  shortBanner.hidden = sc === 0;
  shortBanner.textContent = sc > 1 ? 'Connection is short circuit (' + sc + ')' : 'Connection is short circuit';

  if (checkOn && !pcb) {
    const msgs = checkMessages();
    if (!msgs.length) { checkOn = false; checkBanner.hidden = true; showToast('No problems found'); }
    else { checkBanner.hidden = false; checkBanner.textContent = msgs.join('\n'); }
  } else checkBanner.hidden = true;

  $('#checkBtn').hidden = pcb;

  const b = contentBounds();
  let off = false;
  if (b) {
    const sx0 = b.x0 * view.zoom + view.x, sx1 = b.x1 * view.zoom + view.x;
    const sy0 = b.y0 * view.zoom + view.y, sy1 = b.y1 * view.zoom + view.y;
    off = sx1 < 0 || sx0 > W || sy1 < 0 || sy0 > H;
  }
  $('#fitBtn').hidden = !off;

  $('#hint').hidden = !(project.parts.length === 0 && !pendPart && $('#tray').hidden && !pcb);
  $('#undoBtn').disabled = !undoStack.length;
  $('#redoBtn').disabled = !redoStack.length;
}

shortBanner.addEventListener('click', () => {
  shortFlash = true; render();
  setTimeout(() => { shortFlash = false; render(); }, 3000);
});
checkBanner.addEventListener('click', () => {
  const list = unconnectedList();
  if (!list.length) return;
  const pos = list[checkIdx % list.length]; checkIdx++;
  view.x = W / 2 - pos.x * view.zoom; view.y = H / 2 - pos.y * view.zoom;
  render();
});
$('#checkBtn').addEventListener('click', () => {
  if (screenView !== 'schematic') return;
  if (!checkMessages().length) { showToast(project.parts.length ? 'No problems found' : 'Nothing to check yet'); return; }
  checkOn = true; checkIdx = 0; render();
});
$('#fitBtn').addEventListener('click', fitToContent);

function fitToContent() {
  const b = contentBounds();
  if (!b) return;
  const bw = b.x1 - b.x0, bh = b.y1 - b.y0;
  view.zoom = clamp(Math.min(W / (bw + 80), H / (bh + 120)), MIN_ZOOM, 1.5);
  view.x = W / 2 - (b.x0 + bw / 2) * view.zoom;
  view.y = H / 2 - (b.y0 + bh / 2) * view.zoom;
  render();
}

function showToast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 1800);
}

/* =====================================================================
   Editing: undo / redo, mutations
   ===================================================================== */
function snapshot() {
  return JSON.stringify({ parts: project.parts, wires: project.wires, juncs: project.juncs, nextId: project.nextId });
}
function restore(s) {
  const o = JSON.parse(s);
  project.parts = o.parts; project.wires = o.wires; project.juncs = o.juncs; project.nextId = o.nextId;
}
function nid() { return project.nextId++; }

function mutate(fn) {
  undoStack.push(snapshot());
  if (undoStack.length > 100) undoStack.shift();
  redoStack = [];
  fn();
  cascade();
  flowDirty = true;
  const sz = computeNets().shorts.size;
  if (sz > lastShort) vib([80, 50, 80]);
  lastShort = sz;
  scheduleSave();
  render();
}

function cascade() {
  let again = true;
  while (again) {
    const n0 = project.wires.length, n1 = project.juncs.length;
    const pids = new Set(project.parts.map((p) => p.id));
    const wids = new Set(project.wires.map((w) => w.id));
    project.juncs = project.juncs.filter((j) => wids.has(j.w));
    const jids = new Set(project.juncs.map((j) => j.id));
    project.wires = project.wires.filter((w) => [w.a, w.b].every((e) => (e.j !== undefined ? jids.has(e.j) : pids.has(e.p))));
    again = n0 !== project.wires.length || n1 !== project.juncs.length;
  }
}

function afterRestore() {
  if (selPart !== null && !partById(selPart)) selPart = null;
  if (selWire && !wireById(selWire.id)) selWire = null;
  pendEnd = null;
  flowDirty = true;
  lastShort = computeNets().shorts.size;
  updateSheet(); scheduleSave(); render();
}
function undo() {
  if (!project || !undoStack.length) return;
  redoStack.push(snapshot()); restore(undoStack.pop()); afterRestore();
}
function redo() {
  if (!project || !redoStack.length) return;
  undoStack.push(snapshot()); restore(redoStack.pop()); afterRestore();
}
$('#undoBtn').addEventListener('click', undo);
$('#redoBtn').addEventListener('click', redo);

function nextLabel(base) {
  const used = new Set(project.parts.map((p) => p.label.toLowerCase()));
  let n = 1;
  while (used.has((base + ' ' + n).toLowerCase())) n++;
  return base + ' ' + n;
}
function dupName(v, exceptId) {
  return project.parts.some((q) => q.id !== exceptId && q.label.toLowerCase() === v.toLowerCase());
}

function createWire(a, b) {
  const same = (x, y) => (x.j !== undefined ? x.j === y.j : x.p === y.p && x.t === y.t);
  if (same(a, b)) return;
  if (project.wires.some((w) => (same(w.a, a) && same(w.b, b)) || (same(w.a, b) && same(w.b, a)))) return;
  mutate(() => { project.wires.push({ id: nid(), a, b }); });
  vib(20);
}

// Junctions can only sit on a board dot: the distance along the wire is whole grid steps
function makeJunctionWire(wireId, along, endpoint) {
  const w = wireById(wireId);
  if (!w) return;
  const len = pathLen(routeWire(w));
  const maxD = Math.floor(len / G + 1e-6) - 1;
  if (maxD < 1) { showToast('That wire is too short for a junction'); return; }
  const d = clamp(Math.round(along / G), 1, maxD);
  mutate(() => {
    const j = { id: nid(), w: wireId, d };
    project.juncs.push(j);
    project.wires.push({ id: nid(), a: endpoint, b: { j: j.id } });
  });
  vib(20);
}

function placePending(w) {
  const lab = $('#fLabel'), val = $('#fValue');
  if (lab && lab.value.trim() && !dupName(lab.value.trim(), null)) pendPart.label = lab.value.trim();
  if (val) pendPart.value = val.value;
  const gx = Math.round(w.x / G), gy = Math.round(w.y / G);
  const b = project.board;
  if (gx < b.x0 || gx > b.x1 || gy < b.y0 || gy > b.y1) { showToast('Place it on the board'); return; }
  const pp = pendPart;
  pendPart = null;
  mutate(() => {
    project.parts.push({ id: nid(), kind: pp.kind, type: pp.type, x: gx, y: gy, rot: 0, flip: false, on: false, label: pp.label, value: pp.value });
  });
  updateSheet();
}

function duplicatePart(src) {
  let np = null;
  mutate(() => {
    np = { id: nid(), kind: src.kind, type: src.type, x: src.x + 2, y: src.y + 2, rot: src.rot, flip: !!src.flip, on: !!src.on, label: nextLabel(kindName(src.kind)), value: src.value };
    project.parts.push(np);
  });
  selPart = np.id; selWire = null;
  updateSheet(); render();
}

/* =====================================================================
   Hit testing
   ===================================================================== */
function hitTerminal(wx, wy) {
  const r = HIT_PX() / view.zoom;
  let best = null, bd = r;
  project.parts.forEach((p) => {
    getTerms(p.kind, p.type).forEach((t, i) => {
      const pos = termWorld(p, i);
      const d = Math.hypot(pos.x - wx, pos.y - wy);
      if (d <= bd) { bd = d; best = { p: p.id, t: i }; }
    });
  });
  return best;
}
function hitPart(wx, wy) {
  const gx = wx / G, gy = wy / G;
  for (let i = project.parts.length - 1; i >= 0; i--) {
    const p = project.parts[i], b = partBounds(p);
    if (gx >= b.x0 && gx <= b.x1 && gy >= b.y0 && gy <= b.y1) return p;
  }
  return null;
}
function hitWire(wx, wy) {
  const r = 14 / view.zoom;
  let best = null, bd = r;
  project.wires.forEach((w) => {
    const c = closestOnPath(routeWire(w), wx, wy);
    if (c.dist <= bd) { bd = c.dist; best = { id: w.id, d: c.along }; }
  });
  return best;
}

/* =====================================================================
   Tap handling
   ===================================================================== */
function handleTap(sx, sy) {
  if (!project) return;
  const w = toWorld(sx, sy);
  checkOn = false;

  if (screenView === 'pcb') {
    const p = hitPart(w.x, w.y);
    selPart = p ? p.id : null; selWire = null;
    updateSheet(); render(); return;
  }
  if (pendPart) { placePending(w); return; }

  const term = hitTerminal(w.x, w.y);
  if (term) { tapTerminal(term); return; }

  if (pendEnd) {
    const wh = hitWire(w.x, w.y);
    if (wh) { const e = pendEnd; pendEnd = null; makeJunctionWire(wh.id, wh.d, e); return; }
    pendEnd = null;
    const p = hitPart(w.x, w.y);
    selPart = p ? p.id : null; selWire = null;
    updateSheet(); render(); return;
  }

  const p = hitPart(w.x, w.y);
  if (p) {
    if (p.kind === 'switch' && p.type !== 'push') mutate(() => { p.on = !p.on; });
    selPart = p.id; selWire = null; updateSheet(); render(); return;
  }
  const wh = hitWire(w.x, w.y);
  if (wh) { selWire = { id: wh.id, d: wh.d }; selPart = null; updateSheet(); render(); return; }
  selPart = null; selWire = null;
  updateSheet(); render();
}

function tapTerminal(term) {
  if (pendEnd) {
    const e = pendEnd; pendEnd = null;
    if (e.p === term.p && e.t === term.t) { render(); return; }
    createWire(e, term); return;
  }
  if (selWire) {
    const sw = selWire; selWire = null;
    updateSheet();
    makeJunctionWire(sw.id, sw.d, term); return;
  }
  selPart = null; selWire = null;
  pendEnd = term;
  updateSheet(); render();
}

/* =====================================================================
   Finger control: pan, pinch zoom, move selected part, hold push button
   ===================================================================== */
const ptrs = new Map();
let gesture = null;

function local(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function pinchInfo() {
  const [a, b] = [...ptrs.values()];
  return { mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, dist: Math.hypot(a.x - b.x, a.y - b.y) };
}

function endPartDrag() {
  if (gesture && gesture.mode === 'part' && gesture.changed) {
    undoStack.push(gesture.snap);
    if (undoStack.length > 100) undoStack.shift();
    redoStack = [];
    scheduleSave();
    render();
  }
}

function releaseHeld() {
  if (heldId !== null) { heldId = null; flowDirty = true; render(); }
}

canvas.addEventListener('pointerdown', (e) => {
  if (!project) return;
  canvas.setPointerCapture(e.pointerId);
  const p = local(e);
  ptrs.set(e.pointerId, p);
  if (ptrs.size === 1) {
    gesture = { mode: 'tap', sx: p.x, sy: p.y };
    if (screenView === 'schematic' && !pendPart) {
          const w = toWorld(p.x, p.y);
      if (!hitTerminal(w.x, w.y)) {
        const hp = hitPart(w.x, w.y);
        if (hp && hp.kind === 'switch' && hp.type === 'push') { heldId = hp.id; flowDirty = true; render(); }
      }
    }
  } else { endPartDrag(); gesture = { mode: 'pinch' }; }
});

canvas.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId) || !gesture) return;
  const prev = ptrs.get(e.pointerId), now = local(e);

  if (ptrs.size >= 2) {
    const before = pinchInfo();
    ptrs.set(e.pointerId, now);
    const after = pinchInfo();
    if (before.dist > 0) {
      const nz = clamp(view.zoom * (after.dist / before.dist), MIN_ZOOM, MAX_ZOOM);
      const f = nz / view.zoom;
      view.x = after.mid.x - (before.mid.x - view.x) * f;
      view.y = after.mid.y - (before.mid.y - view.y) * f;
      view.zoom = nz;
    }
    render(); return;
  }

  ptrs.set(e.pointerId, now);
  if (gesture.mode === 'tap' && Math.hypot(now.x - gesture.sx, now.y - gesture.sy) > 8) {
    gesture.mode = 'pan';
    if (screenView === 'schematic' && selPart !== null && !pendPart) {
      const w = toWorld(gesture.sx, gesture.sy);
      const hp = hitPart(w.x, w.y);
      if (!hitTerminal(w.x, w.y) && hp && hp.id === selPart) {
        gesture.mode = 'part';
        gesture.snap = snapshot();
        gesture.orig = { x: hp.x, y: hp.y };
        gesture.w0 = w;
        gesture.changed = false;
      }
    }
  }
  if (gesture.mode === 'pan') {
    view.x += now.x - prev.x; view.y += now.y - prev.y; render();
  } else if (gesture.mode === 'part') {
    const p = partById(selPart), w = toWorld(now.x, now.y);
    const nx = gesture.orig.x + Math.round((w.x - gesture.w0.x) / G);
    const ny = gesture.orig.y + Math.round((w.y - gesture.w0.y) / G);
    if (nx !== p.x || ny !== p.y) { p.x = nx; p.y = ny; gesture.changed = true; fastRoute = true; render(); }
  }
});

function pointerEnd(e, cancelled) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (!gesture) { releaseHeld(); return; }
  if (ptrs.size === 0) {
    releaseHeld();
    if (gesture.mode === 'tap' && !cancelled) handleTap(gesture.sx, gesture.sy);
    else if (gesture.mode === 'part') endPartDrag();
    gesture = null;
    if (fastRoute) { fastRoute = false; routesSig = null; render(); }
    if (flow && flow.any) startAnim();
  } else if (ptrs.size === 1) {
    gesture = { mode: 'pan' };
  }
}
canvas.addEventListener('pointerup', (e) => pointerEnd(e, false));
canvas.addEventListener('pointercancel', (e) => pointerEnd(e, true));

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const p = local(e);
  const nz = clamp(view.zoom * Math.exp(-e.deltaY * 0.0015), MIN_ZOOM, MAX_ZOOM);
  const f = nz / view.zoom;
  view.x = p.x - (p.x - view.x) * f; view.y = p.y - (p.y - view.y) * f;
  view.zoom = nz; render();
}, { passive: false });

/* =====================================================================
   Draw tray
   ===================================================================== */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function openTray() {

const DESC = {
  diode: 'Lets current flow one way only',
  resistor: 'Limits the current',
  capacitor: 'Stores charge and blocks DC',
  transformer: 'Changes AC voltage up or down',
  ac: 'Supplies alternating current',
  dc: 'Supplies direct current',
  regulator: 'Keeps the output voltage steady',
  led: 'Lights up when current flows from + to \u2212',
  bulb: 'Lights up when current flows',

  ic: 'A chip with many parts inside',

function field(labelText, value, onChange) {
  const wrap = el('label', '', labelText);
  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = value; inp.maxLength = 30;
  inp.addEventListener('change', () => onChange(inp));
  wrap.appendChild(inp);
  return { wrap, inp };
}

function updateSheet() {
  const sh = $('#sheet');
  const pcb = screenView === 'pcb';
  if (pendPart && !pcb) { buildEditSheet(sh, pendPart, true); return; }
  const p = selPart !== null ? partById(selPart) : null;
  if (selPart !== null && !p) selPart = null;
  if (p) { if (pcb) buildInfoSheet(sh, p); else buildEditSheet(sh, p, false); return; }
  if (selWire && !pcb) { buildWireSheet(sh); return; }
  sh.hidden = true; sh.innerHTML = '';
}

function sheetButton(text, fn, cls) {
  const b = el('button', cls || '', text);
  b.type = 'button';
  b.addEventListener('click', fn);
  return b;
}

function buildEditSheet(sh, src, pending) {
  sh.hidden = false; sh.innerHTML = '';
  const note = src.kind === 'note';
  sh.appendChild(el('div', 'sh-title', note ? 'Note' : kindName(src.kind) + ' \u2022 ' + typeName(src.kind, src.type)));

  const row = el('div', 'sh-fields');
  if (!note) {
    const lab = field('Label', src.label, (inp) => {
      const v = inp.value.trim();
      if (!v) { inp.value = src.label; return; }
      if (dupName(v, pending ? null : src.id)) { showToast('Name already used'); inp.value = src.label; return; }
      if (pending) src.label = v; else mutate(() => { src.label = v; });
    });
    lab.inp.id = 'fLabel';
    row.appendChild(lab.wrap);
  }
  const val = field(note ? 'Text' : 'Value', src.value, (inp) => {
    const v = inp.value.trim();
    if (pending) src.value = v; else mutate(() => { src.value = v; });
  });
  val.inp.id = 'fValue';
  row.appendChild(val.wrap);
  sh.appendChild(row);

  if (pending) {
    sh.appendChild(el('div', 'sh-note', 'Tap the board to place it.'));
    const r = el('div', 'sh-row');
    r.appendChild(sheetButton('Cancel', () => { pendPart = null; updateSheet(); render(); }));
    sh.appendChild(r);
    return;
  }

  const r = el('div', 'sh-row grid');
  if (!note) {
    r.appendChild(sheetButton('Rotate', () => mutate(() => { src.rot = (src.rot + 1) % 4; })));
    r.appendChild(sheetButton('Flip', () => mutate(() => { src.flip = !src.flip; })));
  }
  r.appendChild(sheetButton('Duplicate', () => duplicatePart(src)));
  r.appendChild(sheetButton('Delete', () => {
    const id = src.id;
    selPart = null;
    mutate(() => { project.parts = project.parts.filter((q) => q.id !== id); });
    updateSheet();
  }, 'danger'));
  sh.appendChild(r);
}

function buildWireSheet(sh) {
  sh.hidden = false; sh.innerHTML = '';
  sh.appendChild(el('div', 'sh-title', 'Wire'));
  sh.appendChild(el('div', 'sh-note', 'Tap a terminal to branch from this wire. Junctions sit on a dot.'));
  const r = el('div', 'sh-row grid');
  r.appendChild(sheetButton('Flip bend', () => {
    const w = wireById(selWire.id);
    if (w) mutate(() => { w.flip = !w.flip; });
  }));
  r.appendChild(sheetButton('Delete wire', () => {
    const id = selWire.id;
    selWire = null;
    mutate(() => { project.wires = project.wires.filter((w) => w.id !== id); });
    updateSheet();
  }, 'danger'));
  sh.appendChild(r);
}

function buildInfoSheet(sh, p) {
  sh.hidden = false; sh.innerHTML = '';
  sh.appendChild(el('div', 'sh-title', p.kind === 'note' ? 'Note' : p.label));
  const info = el('div', 'sh-info');
  const line = (k, v) => { const d = el('div'); d.append(el('b', '', k + ': '), document.createTextNode(v)); info.appendChild(d); };
  if (p.kind === 'note') { line('Text', p.value); sh.appendChild(info); return; }
  line('Part', kindName(p.kind) + ' \u2022 ' + typeName(p.kind, p.type));
  line('Value', p.value);
  line('Does', DESC[p.kind] || '');
  getTerms(p.kind, p.type).forEach((t) => {
    const name = t.l && t.l !== '+' && t.l !== '\u2212' ? t.l + ' \u2013 ' : '';
    info.appendChild(el('div', '', name + t.d));
  });
  sh.appendChild(info);
}

function saveBlob(blob, name) {
  if (!blob) { showToast('Could not create the picture'); return; }
  try {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(() => { /* share cancelled */ });
      return;
    }
  } catch (e) { /* fall back to a download */ }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  showToast('Picture saved');
}

function exportPicture() {
  const b = contentBounds();
  if (!b) { showToast('Nothing to save yet'); return; }
  const pad = 70, zoom = 1.5;
  const off = document.createElement('canvas');
  off.width = Math.min(4000, Math.round((b.x1 - b.x0 + pad * 2) * zoom));
  off.height = Math.min(4000, Math.round((b.y1 - b.y0 + pad * 2) * zoom));
  const sv = { ctx, W, H, vx: view.x, vy: view.y, vz: view.zoom, sp: selPart, sw: selWire, pe: pendEnd, co: checkOn, sf: shortFlash };
  const name = (project.name || 'sketch2board') + (screenView === 'pcb' ? '-pcb' : '-schematic') + '.png';
  try {
    exporting = true;
    ctx = off.getContext('2d'); W = off.width; H = off.height; renderDpr = 1;
    view.zoom = zoom; view.x = (pad - b.x0) * zoom; view.y = (pad - b.y0) * zoom;
    selPart = null; selWire = null; pendEnd = null; checkOn = false; shortFlash = false;
    render();
  } finally {
    ctx = sv.ctx; W = sv.W; H = sv.H; renderDpr = null;
    view.x = sv.vx; view.y = sv.vy; view.zoom = sv.vz;
    selPart = sv.sp; selWire = sv.sw; pendEnd = sv.pe; checkOn = sv.co; shortFlash = sv.sf;
    exporting = false;
    render();
  }
  off.toBlob((blob) => saveBlob(blob, name), 'image/png');
}

const LS = (() => { try { return window.localStorage; } catch (e) { return null; } })();
function lsGet(k) { try { return LS && LS.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (LS) LS.setItem(k, v); } catch (e) { /* storage full or blocked */ } }

function listProjects() {
  const out = [];

    for (let i = 0; i < LS.length; i++) {
      const k = LS.key(i);
      if (k && k.indexOf('s2b_p_') === 0) {
        try { out.push(JSON.parse(LS.getItem(k))); } catch (e) { /* skip broken */ }
      }
    }
  } catch (e) { /* no storage */ }
  return out.sort((a, b) => (b.updated || 0) - (a.updated || 0));

function migrateProject() {
  project.parts.forEach((p) => { if (p.flip === undefined) p.flip = false; });
  project.juncs.slice().sort((a, b) => a.id - b.id).forEach((j) => {
    if (j.d !== undefined) return;
    const h = wireById(j.w);
    const len = h ? pathLen(routeWire(h)) : 0;
    j.d = Math.max(1, Math.round((j.t === undefined ? 0.5 : j.t) * len / G));
    delete j.t;
  });
}

        window.s2bWaitingWorker = registration.waiting;

        if (window.s2bUpdateReady) {

      'controllerchange',
      function () {
        if (s2bReloadingForUpdate) return;

    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js')
        .then(function (registration) {

          s2bShowWaitingUpdate(registration);

          registration.addEventListener(
            'updatefound',
            function () {
              var newWorker = registration.installing;
              if (!newWorker) return;

              newWorker.addEventListener(
                'statechange',
                function () {

    });
  }
