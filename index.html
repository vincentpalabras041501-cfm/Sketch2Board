<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Sketch2Board</title>
  <meta name="theme-color" content="#6C4AFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sketch2Board">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
:root {
  --top: 56px;
  --bot: 64px;
  --fs: 18px;
  --btn: 52px;
  --r: 10px;
}
@media (min-width: 601px) {
  :root { --top: 50px; --bot: 55px; --fs: 17.5px; --btn: 46px; }
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #0e1318;
  color: #d9e0e8;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  font-size: var(--fs);
  color: inherit;
  cursor: pointer;
  border-radius: var(--r);
}

input {
  font: inherit;
  user-select: text;
  -webkit-user-select: text;
  border-radius: 8px;
}

/* ---------- Screens ---------- */
.screen {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  background: #0e1318;
}
.screen.on { display: flex; }

/* ---------- Splash ---------- */
#splash {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #0e1318;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: opacity .35s;
}
#splash.out { opacity: 0; pointer-events: none; }
.sp-name { font-size: 34px; font-weight: 700; color: #fff; }
.sp-by { font-size: 16px; color: #8e9bab; text-align: center; padding: 0 20px; }

/* ---------- Shared buttons ---------- */
.primary {
  background: #2f7de1;
  border: 0;
  color: #fff;
  padding: 12px 18px;
  font-weight: 600;
  min-height: var(--btn);
}
.danger {
  background: #7f1d1d;
  border: 0;
  color: #fff;
  min-height: var(--btn);
}

/* ---------- Home ---------- */
.home-head {
  padding: calc(22px + env(safe-area-inset-top, 0px)) 20px 16px;
  border-bottom: 1px solid #263140;
}
.home-title { font-size: 32px; font-weight: 800; color: #fff; }
.home-sub { font-size: 15px; color: #8e9bab; margin-top: 2px; }
.home-body {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px));
}
.big {
  display: block;
  width: 100%;
  min-height: 62px;
  font-size: 20px;
  margin-bottom: 12px;
}
#contBtn { background: #22a05a; }

.sec-title {
  margin: 26px 0 10px;
  color: #8e9bab;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.style-row { display: flex; gap: 10px; flex-wrap: wrap; }
.style-row button {
  flex: 1;
  min-height: var(--btn);
  background: #171e26;
  border: 1px solid #2c3a4a;
  padding: 10px 12px;
}
.style-row button.on { background: #2f7de1; border-color: #2f7de1; color: #fff; }

.ex {
  display: block;
  width: 100%;
  text-align: left;
  min-height: var(--btn);
  background: #171e26;
  border: 1px solid #2c3a4a;
  padding: 12px 16px;
  margin-bottom: 8px;
}
.proj {
  background: #171e26;
  border: 1px solid #263140;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}
.proj .pn { font-weight: 700; color: #fff; font-size: 19px; }
.proj .pd { font-size: 13px; color: #8e9bab; margin: 3px 0 12px; }
.proj-row { display: flex; gap: 8px; }
.proj-row button {
  flex: 1;
  min-height: var(--btn);
  background: #1f2832;
  border: 1px solid #2c3a4a;
  padding: 8px 6px;
}
.proj-row button.primary { background: #2f7de1; border-color: #2f7de1; }
.proj-row button.danger { background: #7f1d1d; border-color: #7f1d1d; }
.empty-list { color: #6b7888; font-size: 16px; padding: 6px 0; }

/* ---------- Bars ---------- */
#topbar,
#bottombar {
  flex: 0 0 auto;
  display: flex;
  align-items: stretch;
  background: #171e26;
}
#topbar {
  height: calc(var(--top) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 6px 0;
  border-bottom: 1px solid #263140;
}
#bottombar {
  height: calc(var(--bot) + env(safe-area-inset-bottom, 0px));
  padding: 0 6px env(safe-area-inset-bottom, 0px);
  border-top: 1px solid #263140;
}
#topbar button,
#bottombar button {
  background: transparent;
  border: 0;
  margin: 5px 3px;
  padding: 0 14px;
}
#topbar button:active,
#bottombar button:active { background: #263140; }
#topbar button:disabled { opacity: .35; }
#topbar .right { margin-left: auto; background: #2f7de1; color: #fff; font-weight: 600; }
#bottombar button { flex: 1; color: #8e9bab; }
#bottombar button.active { color: #fff; background: #263548; box-shadow: inset 0 -3px 0 #3b82f6; }
#bottombar button.open { color: #fff; background: #263548; }

/* ---------- Board area ---------- */
#boardArea {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  overflow: hidden;
}
#board {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#banners {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 64px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
}
.banner {
  pointer-events: auto;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  white-space: pre-line;
}
.banner.short { background: #b91c1c; }
.banner.check { background: #c2570c; }

#checkBtn,
#fitBtn {
  position: absolute;
  right: 8px;
  border: 0;
  background: #171e26;
  color: #fff;
  box-shadow: 0 1px 6px rgba(0,0,0,.4);
}
#checkBtn { top: 8px; width: 50px; height: 50px; border-radius: 25px; font-size: 24px; }
#fitBtn { top: 66px; min-height: 44px; padding: 0 18px; border-radius: 22px; }

#hint {
  position: absolute;
  left: 0;
  right: 0;
  top: 42%;
  text-align: center;
  color: #6f7f90;
  font-size: 20px;
  pointer-events: none;
}
#toast {
  position: absolute;
  left: 50%;
  top: 40%;
  transform: translateX(-50%);
  background: rgba(23,30,38,.96);
  color: #fff;
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 16px;
  pointer-events: none;
  z-index: 6;
  max-width: 84%;
  text-align: center;
}

#legend {
  position: absolute;
  left: 8px;
  bottom: 8px;
  z-index: 3;
  background: rgba(23,30,38,.96);
  border: 1px solid #2c3a4a;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 15px;
  line-height: 1.9;
}
#legend .lg-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: #fff; }
#legend .lg-head button { background: transparent; border: 0; padding: 0 6px; font-size: 22px; }
#legend .sw { display: inline-block; width: 26px; height: 6px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }

/* ---------- Tray and sheet ---------- */
#tray,
#sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  background: #171e26;
  border-top: 1px solid #263140;
  z-index: 4;
}
#tray { max-height: 70%; display: flex; flex-direction: column; border-radius: 16px 16px 0 0; }
.tray-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 8px 8px 14px;
  border-bottom: 1px solid #263140;
}
.tray-head span { flex: 1; font-weight: 700; font-size: 18px; }
.tray-head button { background: transparent; border: 0; padding: 8px 12px; min-height: 44px; }
#trayGrid {
  flex: 1;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 12px;
}
#trayGrid button {
  background: #1f2832;
  border: 1px solid #2c3a4a;
  min-height: var(--btn);
  padding: 12px 6px;
}
#trayGrid button:active { background: #2a3644; }
#trayGrid.types { grid-template-columns: repeat(2, 1fr); }
#trayTools {
  display: flex;
  gap: 10px;
  padding: 10px 12px 12px;
  border-top: 1px solid #263140;
}
#trayTools button {
  flex: 1;
  min-height: var(--btn);
  background: #263548;
  border: 1px solid #34465c;
  padding: 8px 6px;
  font-size: 16px;
}

#sheet { padding: 14px 16px 16px; border-radius: 16px 16px 0 0; }
.sh-title { font-weight: 700; margin-bottom: 12px; color: #fff; font-size: 18px; }
.sh-fields { display: flex; gap: 12px; }
.sh-fields label {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 13px;
  color: #8e9bab;
}
.sh-fields input {
  background: #0e1318;
  border: 1px solid #2c3a4a;
  color: #fff;
  padding: 0 12px;
  height: 48px;
  font-size: 17px;
  width: 100%;
}
.sh-note { margin-top: 12px; font-size: 15px; color: #8e9bab; }
.sh-row { display: flex; gap: 10px; margin-top: 14px; }
.sh-row.grid { display: grid; grid-template-columns: 1fr 1fr; }
.sh-row button {
  flex: 1;
  background: #1f2832;
  border: 1px solid #2c3a4a;
  min-height: var(--btn);
  padding: 10px;
}
.sh-row button.danger { background: #7f1d1d; border-color: #7f1d1d; color: #fff; }
.sh-info { font-size: 16px; line-height: 1.6; color: #c5cfda; }
.sh-info b { color: #fff; }

/* ---------- Dialogs ---------- */
#dialog,
#tutorial,
#listView {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(0,0,0,.6);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.card {
  width: 100%;
  max-width: 380px;
  background: #171e26;
  border: 1px solid #2c3a4a;
  border-radius: 16px;
  padding: 20px;
}
.card-title { font-weight: 600; font-size: 18px; color: #fff; line-height: 1.45; }
.card input {
  width: 100%;
  margin-top: 14px;
  background: #0e1318;
  border: 1px solid #2c3a4a;
  color: #fff;
  padding: 0 12px;
  height: 50px;
  font-size: 17px;
}
.card-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.card-row button {
  min-height: var(--btn);
  padding: 0 18px;
  background: #1f2832;
  border: 1px solid #2c3a4a;
}
.card-row button.primary { background: #2f7de1; border-color: #2f7de1; }
.card-row button.dangerbtn { background: #b91c1c; border-color: #b91c1c; color: #fff; }

#listView .card { max-width: 460px; max-height: 80%; display: flex; flex-direction: column; }
#listBody { overflow-y: auto; margin-top: 12px; }
.lrow {
  display: grid;
  grid-template-columns: 1.1fr 1.6fr 1fr;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid #263140;
  font-size: 15px;
}
.lrow .l1 { font-weight: 700; color: #fff; }

/* ---------- Update message ---------- */
#updateBar {
  position: fixed;
  left: 10px;
  right: 10px;
  top: calc(10px + env(safe-area-inset-top, 0px));
  z-index: 60;
  background: #22a05a;
  color: #fff;
  font-weight: 700;
  text-align: center;
  padding: 14px;
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.45);
}

</style>
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <div class="sp-name">Sketch2Board</div>
    <div class="sp-by">by M5</div>
  </div>

  <!-- Home -->
  <section id="home" class="screen">
    <header class="home-head">
      <div class="home-title">Sketch2Board</div>
      <div class="home-sub">by M5</div>
    </header>
    <div class="home-body">
      <button id="contBtn" type="button" class="primary big" hidden></button>
      <button id="newBtn" type="button" class="primary big">New project</button>

      <div class="sec-title">Symbol style</div>
      <div class="style-row">
        <button type="button" data-style="ansi">ANSI (zigzag)</button>
        <button type="button" data-style="iec">IEC (rectangle)</button>
      </div>

      <div class="sec-title">Examples</div>
      <div id="exList"></div>

      <div class="sec-title">Saved projects</div>
      <div id="projList"></div>
    </div>
  </section>

  <!-- Editor -->
  <section id="editor" class="screen">
    <header id="topbar">
      <button id="homeBtn" type="button">Home</button>
      <button id="undoBtn" type="button">Undo</button>
      <button id="redoBtn" type="button">Redo</button>
      <button id="saveBtn" type="button" class="right">Save</button>
    </header>

    <main id="boardArea">
      <canvas id="board"></canvas>

      <div id="banners"></div>
      <button id="checkBtn" type="button" aria-label="Check the circuit">&#10003;</button>
      <button id="fitBtn" type="button" hidden>Fit</button>
      <div id="hint" hidden>Tap Draw to start</div>
      <div id="toast" hidden></div>

      <div id="legend" hidden>
        <div class="lg-head"><span>Legend</span><button id="legendClose" type="button" aria-label="Close">&times;</button></div>
        <div><span class="sw" style="background:#d62828"></span>Positive (+)</div>
        <div><span class="sw" style="background:#0b0b0b"></span>Negative (&minus;)</div>
        <div><span class="sw" style="background:#facc15"></span>Current flow</div>
      </div>

      <div id="tray" hidden>
        <div class="tray-head">
          <button id="trayBack" type="button" hidden>&lsaquo; Back</button>
          <span id="trayTitle">Choose a part</span>
          <button id="trayClose" type="button" aria-label="Close">&times;</button>
        </div>
        <div id="trayGrid"></div>
        <div id="trayTools">
          <button id="toolList" type="button">Parts list</button>
          <button id="toolPic" type="button">Save picture</button>
          <button id="toolLegend" type="button">Legend</button>
        </div>
      </div>

      <div id="sheet" hidden></div>
    </main>

    <nav id="bottombar">
      <button type="button" data-view="schematic" class="active">Schematic</button>
      <button type="button" data-view="pcb">PCB</button>
      <button type="button" id="drawBtn">Draw</button>
    </nav>
  </section>

  <!-- Parts list -->
  <div id="listView" hidden>
    <div class="card">
      <div class="card-title">Parts list</div>
      <div id="listBody"></div>
      <div class="card-row">
        <button id="listClose" type="button">Close</button>
        <button id="listSave" type="button" class="primary">Save as image</button>
      </div>
    </div>
  </div>

  <!-- Name / rename / confirm dialog -->
  <div id="dialog" hidden>
    <div class="card">
      <div id="dlgTitle" class="card-title"></div>
      <input id="dlgInput" type="text" maxlength="40" placeholder="Project name" autocomplete="off" hidden>
      <div class="card-row">
        <button id="dlgCancel" type="button">Cancel</button>
        <button id="dlgOk" type="button" class="primary">OK</button>
      </div>
    </div>
  </div>

  <!-- First-time help -->
  <div id="tutorial" hidden>
    <div class="card">
      <div id="tutText" class="card-title"></div>
      <div class="card-row">
        <button id="tutSkip" type="button">Skip</button>
        <button id="tutNext" type="button" class="primary">Next</button>
      </div>
    </div>
  </div>

  <div id="updateBar" hidden>Update available. Tap to refresh.</div>

  <script>
'use strict';
/* Sketch2Board by M5 */
window.s2bReady = true;
window.addEventListener('error', function (e) {
  var n = document.querySelector('.sp-by');
  if (n) n.textContent = 'Error: ' + e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '');
});
function safeHistory(fn) { try { fn(); } catch (err) { /* history not available here */ } }

/* =====================================================================
   Constants and part catalogue
   ===================================================================== */
const G = 28;                       // one grid step in board units (symbols are 40% bigger)
const MIN_ZOOM = 0.6, MAX_ZOOM = 2;
const FADE_OUT_AT = 0.5, FADE_IN_AT = 0.75;
const INK = '#1b2a3b', PAPER = '#f7f9fb';
const C = {
  blue: '#2f7de1', green: '#22c55e', red: '#d62828', black: '#0b0b0b',
  gray: '#8b95a1', short: '#c026d3', orange: '#f97316', sel: '#3b82f6'
};
// Two-terminal parts without polarity that let a wire's polarity colour pass through
const PASS = new Set(['resistor', 'inductor', 'bulb', 'capacitor']);

const KINDS = [
  ['diode', 'Diode'], ['resistor', 'Resistor'], ['capacitor', 'Capacitor'],
  ['transformer', 'Transformer'], ['ac', 'AC source'], ['dc', 'DC'],
  ['regulator', 'Voltage regulator'], ['led', 'LED'], ['bulb', 'Bulb'],
  ['motor', 'Motor'], ['inductor', 'Inductor'], ['relay', 'Relay'],
  ['ic', 'IC'], ['transistor', 'Transistor'], ['switch', 'Switch'], ['note', 'Note']
];

const TYPES = {
  diode: [['rectifier', 'Rectifier'], ['zener', 'Zener'], ['schottky', 'Schottky']],
  resistor: [['fixed', 'Fixed'], ['variable', 'Variable'], ['photo', 'Photoresistor'], ['thermistor', 'Thermistor']],
  capacitor: [['ceramic', 'Ceramic'], ['electrolytic', 'Electrolytic'], ['tantalum', 'Tantalum'], ['variable', 'Variable']],
  transformer: [['stepdown', 'Step-down'], ['stepup', 'Step-up'], ['center', 'Center-tapped']],
  ac: [['single', 'Single-phase']],
  dc: [['battery', 'Battery'], ['supply', 'DC supply']],
  regulator: [['7805', '7805 (5V)'], ['7812', '7812 (12V)'], ['7905', '7905 (-5V)'], ['7912', '7912 (-12V)']],
  led: [['standard', 'Standard'], ['rgb', 'RGB']],
  bulb: [['incandescent', 'Incandescent']],
  motor: [['dc', 'DC motor'], ['stepper', 'Stepper']],
  inductor: [['air', 'Air core'], ['iron', 'Iron core'], ['variable', 'Variable']],
  relay: [['spst', 'SPST'], ['spdt', 'SPDT'], ['dpdt', 'DPDT']],
  ic: [['opamp', 'Op-amp'], ['555', '555 timer'], ['gate', 'Logic gate'], ['dip', 'Generic DIP']],
  transistor: [['npn', 'NPN'], ['pnp', 'PNP'], ['nmos', 'N-MOSFET'], ['pmos', 'P-MOSFET']],
  switch: [['toggle', 'Toggle'], ['push', 'Push button'], ['spdt', 'SPDT']],
  note: [['text', 'Text']]
};

const DEFAULT_VALUE = {
  diode: { rectifier: '1N4007', zener: '1N4733', schottky: '1N5819' },
  resistor: { fixed: '10k', variable: '10k', photo: 'LDR', thermistor: '10k NTC' },
  capacitor: { ceramic: '100nF', electrolytic: '100µF', tantalum: '10µF', variable: '100pF' },
  transformer: { stepdown: '230V:12V', stepup: '12V:230V', center: '230V:12-0-12V' },
  ac: { single: '230V' },
  dc: { battery: '9V', supply: '12V' },
  regulator: { '7805': '7805', '7812': '7812', '7905': '7905', '7912': '7912' },
  led: { standard: 'Red', rgb: 'RGB' },
  bulb: { incandescent: '12V' },
  motor: { dc: '12V', stepper: 'Stepper' },
  inductor: { air: '10mH', iron: '10mH', variable: '10mH' },
  relay: { spst: '5V', spdt: '5V', dpdt: '5V' },
  ic: { opamp: 'LM741', '555': 'NE555', gate: '74HC08', dip: 'DIP-8' },
  transistor: { npn: '2N2222', pnp: '2N2907', nmos: '2N7000', pmos: 'IRF9540' },
  switch: { toggle: 'Toggle', push: 'Push', spdt: 'SPDT' },
  note: { text: 'Note' }
};

/* =====================================================================
   Terminals (local grid coordinates, unrotated)
   x, y = position, l = label shown, pol = '+' / '-' / null, d = description
   ===================================================================== */
function T(x, y, l, pol, d) { return { x, y, l: l || '', pol: pol || null, d: d || l || '' }; }
const termCache = new Map();

function getTerms(kind, type) {
  const key = kind + '|' + type;
  if (!termCache.has(key)) termCache.set(key, buildTerms(kind, type));
  return termCache.get(key);
}

function buildTerms(kind, type) {
  const two = () => [T(-2, 0, '', null, 'Terminal 1'), T(2, 0, '', null, 'Terminal 2')];
  switch (kind) {
    case 'diode':
    case 'led':
      return [T(-2, 0, '+', '+', 'Anode (+)'), T(2, 0, '\u2212', '-', 'Cathode (\u2212)')];
    case 'resistor':
      if (type === 'variable') return [T(-2, 0, '1', null, 'End 1'), T(2, 0, '2', null, 'End 2'), T(0, -2, 'W', null, 'Wiper')];
      return two();
    case 'capacitor':
      if (type === 'electrolytic' || type === 'tantalum')
        return [T(-2, 0, '+', '+', 'Positive (+)'), T(2, 0, '\u2212', '-', 'Negative (\u2212)')];
      return two();
    case 'dc':
      if (type === 'supply') return [T(0, -2, '+', '+', 'Positive (+)'), T(0, 2, '\u2212', '-', 'Negative (\u2212)')];
      return [T(-2, 0, '+', '+', 'Positive (+)'), T(2, 0, '\u2212', '-', 'Negative (\u2212)')];
    case 'ac':
      return [T(0, -2, '', null, 'Terminal 1'), T(0, 2, '', null, 'Terminal 2')];
    case 'transformer': {
      const a = [T(-2, -2, 'P1', null, 'Primary start'), T(-2, 2, 'P2', null, 'Primary end'), T(2, -2, 'S1', null, 'Secondary start')];
      if (type === 'center') a.push(T(2, 0, 'CT', null, 'Center tap'));
      a.push(T(2, 2, 'S2', null, 'Secondary end'));
      return a;
    }
    case 'regulator':
      if (type === '7905' || type === '7912')
        return [T(-3, 0, 'IN\u2212', '-', 'Input (\u2212)'), T(3, 0, 'OUT\u2212', '-', 'Output (\u2212)'), T(0, 2, 'GND', null, 'Ground')];
      return [T(-3, 0, 'IN+', '+', 'Input (+)'), T(3, 0, 'OUT+', '+', 'Output (+)'), T(0, 2, 'GND\u2212', '-', 'Ground (\u2212)')];
    case 'bulb':
    case 'inductor':
      return two();
    case 'motor':
      if (type === 'stepper')
        return [T(-2, -1, 'A1', null, 'Coil A start'), T(-2, 1, 'A2', null, 'Coil A end'), T(2, -1, 'B1', null, 'Coil B start'), T(2, 1, 'B2', null, 'Coil B end')];
      return [T(0, -2, '+', '+', 'Positive (+)'), T(0, 2, '\u2212', '-', 'Negative (\u2212)')];
    case 'relay': {
      const a = [T(-3, -1, '+', '+', 'Coil (+)'), T(-3, 1, '\u2212', '-', 'Coil (\u2212)')];
      if (type === 'spst') a.push(T(0, -3, 'COM', null, 'Common'), T(2, -3, 'NO', null, 'Normally open'));
      else if (type === 'spdt') a.push(T(-2, -3, 'NO', null, 'Normally open'), T(0, -3, 'COM', null, 'Common'), T(2, -3, 'NC', null, 'Normally closed'));
      else a.push(
        T(-2, -3, 'NO1', null, 'Normally open 1'), T(0, -3, 'COM1', null, 'Common 1'), T(2, -3, 'NC1', null, 'Normally closed 1'),
        T(-2, 3, 'NO2', null, 'Normally open 2'), T(0, 3, 'COM2', null, 'Common 2'), T(2, 3, 'NC2', null, 'Normally closed 2'));
      return a;
    }
    case 'ic':
      if (type === 'opamp')
        return [T(-3, -1, '', null, 'Non-inverting input (+)'), T(-3, 1, '', null, 'Inverting input (\u2212)'), T(3, 0, 'OUT', null, 'Output'),
          T(0, -3, 'V+', '+', 'Positive supply (+)'), T(0, 3, 'V\u2212', '-', 'Negative supply (\u2212)')];
      if (type === 'gate')
        return [T(-3, -1, 'A', null, 'Input A'), T(-3, 1, 'B', null, 'Input B'), T(3, 0, 'Y', null, 'Output'),
          T(0, -3, 'VCC+', '+', 'Supply (+)'), T(0, 3, 'GND\u2212', '-', 'Ground (\u2212)')];
      if (type === '555')
        return [T(-3, -3, 'GND\u2212', '-', 'Pin 1 Ground (\u2212)'), T(-3, -1, 'TRG', null, 'Pin 2 Trigger'), T(-3, 1, 'OUT', null, 'Pin 3 Output'), T(-3, 3, 'RST', null, 'Pin 4 Reset'),
          T(3, 3, 'CTL', null, 'Pin 5 Control'), T(3, 1, 'THR', null, 'Pin 6 Threshold'), T(3, -1, 'DIS', null, 'Pin 7 Discharge'), T(3, -3, 'VCC+', '+', 'Pin 8 Supply (+)')];
      return [T(-3, -3, '1', null, 'Pin 1'), T(-3, -1, '2', null, 'Pin 2'), T(-3, 1, '3', null, 'Pin 3'), T(-3, 3, 'GND\u2212', '-', 'Pin 4 Ground (\u2212)'),
        T(3, 3, '5', null, 'Pin 5'), T(3, 1, '6', null, 'Pin 6'), T(3, -1, '7', null, 'Pin 7'), T(3, -3, 'VCC+', '+', 'Pin 8 Supply (+)')];
    case 'switch':
      if (type === 'spdt') return [T(-2, 0, 'COM', null, 'Common'), T(2, -1, '1', null, 'Contact 1'), T(2, 1, '2', null, 'Contact 2')];
      return two();
    case 'note':
      return [];
    case 'transistor':
      if (type === 'nmos' || type === 'pmos')
        return [T(-2, 0, 'G', null, 'Gate'), T(1, -2, 'D', null, 'Drain'), T(1, 2, 'S', null, 'Source')];
      return [T(-2, 0, 'B', null, 'Base'), T(1, -2, 'C', null, 'Collector'), T(1, 2, 'E', null, 'Emitter')];
  }
  return two();
}

// Body box (local grid units) used for selecting and for drawing real components
function getBox(kind, type) {
  switch (kind) {
    case 'regulator': return [-2, -1.2, 2, 1.2];
    case 'relay': return [-2.5, -2, 2.5, 2];
    case 'transformer': return [-1.5, -2, 1.5, 2];
    case 'motor': return [-1.2, -1.2, 1.2, 1.2];
    case 'ic': return (type === '555' || type === 'dip') ? [-2, -4, 2, 4] : [-2, -2, 2, 2];
  }
  return null;
}

/* =====================================================================
   State
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const canvas = $('#board');
let ctx = canvas.getContext('2d');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const kindName = (k) => KINDS.find((x) => x[0] === k)[1];
const typeName = (k, t) => (TYPES[k].find((x) => x[0] === t) || [0, t])[1];

const view = { x: 0, y: 0, zoom: 1 };
let W = 0, H = 0;
let screenView = 'schematic';        // 'schematic' | 'pcb'
let project = null;                  // {id,name,style,parts,wires,juncs,nextId,updated}
let settings = { style: 'ansi' };
let undoStack = [], redoStack = [];
let selPart = null;                  // selected part id
let selWire = null;                  // {id, t}
let pendEnd = null;                  // active terminal {p,t}
let pendPart = null;                 // part waiting to be placed {kind,type,label,value}
let checkOn = false, checkIdx = 0;
let shortFlash = false;
let nets = null;
let saveTimer = null, toastTimer = null;
let curRot = 0, curFlip = false;
let heldId = null;                   // push button being held
let flow = null, flowDirty = true, animT = 0, animRunning = false;
let lastShort = 0, exporting = false, renderDpr = null;

const partById = (id) => project.parts.find((p) => p.id === id);
const wireById = (id) => project.wires.find((w) => w.id === id);

/* =====================================================================
   Geometry
   ===================================================================== */
function rotPt(x, y, r) {
  switch (((r % 4) + 4) % 4) {
    case 1: return [-y, x];
    case 2: return [-x, -y];
    case 3: return [y, -x];
    default: return [x, y];
  }
}

function ft(p, x, y) { return rotPt(p.flip ? -x : x, y, p.rot); }

function termWorld(p, i) {
  const t = getTerms(p.kind, p.type)[i];
  const r = ft(p, t.x, t.y);
  return { x: (p.x + r[0]) * G, y: (p.y + r[1]) * G };
}

function juncPos(id) {
  const j = project.juncs.find((q) => q.id === id);
  const h = j && wireById(j.w);
  if (!h) return { x: 0, y: 0 };
  const pts = routeWire(h);
  return pointAtDist(pts, clamp((j.d || 0) * G, 0, pathLen(pts)));
}

function endPos(e) {
  if (e.j !== undefined) return juncPos(e.j);
  const p = partById(e.p);
  return p ? termWorld(p, e.t) : { x: 0, y: 0 };
}

/* =====================================================================
   Wire routing: straight lines and 90 degree bends only.
   A wire leaves each terminal in the direction that terminal faces.
   ===================================================================== */
let legacyCache = new Map();

function pathLen(pts) {
  let l = 0;
  for (let i = 1; i < pts.length; i++) l += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  return l;
}

function pointAtDist(pts, dist) {
  if (!pts.length) return { x: 0, y: 0 };
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i].x - pts[i - 1].x, dy = pts[i].y - pts[i - 1].y, l = Math.hypot(dx, dy);
    if (dist <= acc + l || i === pts.length - 1) {
      const t = l ? clamp((dist - acc) / l, 0, 1) : 0;
      return { x: pts[i - 1].x + dx * t, y: pts[i - 1].y + dy * t };
    }
    acc += l;
  }
  return pts[pts.length - 1];
}

function segDirAt(pts, dist) {
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i].x - pts[i - 1].x, dy = pts[i].y - pts[i - 1].y, l = Math.hypot(dx, dy);
    if (l && (dist <= acc + l + 0.01 || i === pts.length - 1)) return [dx / l, dy / l];
    acc += l;
  }
  return [1, 0];
}

// Part of a path between two distances (d1 may be Infinity for "to the end")
function subPath(pts, d0, d1) {
  const len = pathLen(pts);
  const e1 = Math.min(d1, len);
  const out = [pointAtDist(pts, d0)];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    acc += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    if (acc > d0 + 0.01 && acc < e1 - 0.01) out.push(pts[i]);
  }
  out.push(pointAtDist(pts, e1));
  return out;
}

function closestOnPath(pts, x, y) {
  let best = { dist: Infinity, along: 0 }, acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    const s = segDist(x, y, pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y);
    if (s.d < best.dist) best = { dist: s.d, along: acc + s.t * l };
    acc += l;
  }
  return best;
}

function dedupePts(pts) {
  const out = [];
  pts.forEach((q) => {
    const l = out[out.length - 1];
    if (l && Math.abs(l.x - q.x) < 0.01 && Math.abs(l.y - q.y) < 0.01) return;
    out.push({ x: q.x, y: q.y });
  });
  return out;
}

function mergeCollinear(pts) {
  const out = pts.slice();
  for (let i = out.length - 2; i > 0; i--) {
    const a = out[i - 1], b = out[i], c = out[i + 1];
    if ((Math.abs(a.x - b.x) < 0.01 && Math.abs(b.x - c.x) < 0.01) || (Math.abs(a.y - b.y) < 0.01 && Math.abs(b.y - c.y) < 0.01)) out.splice(i, 1);
  }
  return out;
}

function pathOk(pts, avoid) {
  for (let i = 1; i < pts.length - 1; i++) {
    const ax = pts[i].x - pts[i - 1].x, ay = pts[i].y - pts[i - 1].y;
    const bx = pts[i + 1].x - pts[i].x, by = pts[i + 1].y - pts[i].y;
    if (ax * bx + ay * by < -0.01) return false;              // would go back on itself
  }
  if (avoid && pts.length > 1) {
    const n = pts.length, lx = pts[n - 1].x - pts[n - 2].x, ly = pts[n - 1].y - pts[n - 2].y;
    if (Math.abs(lx * avoid[1] - ly * avoid[0]) < 0.01) return false;   // would run along the host wire
  }
  return true;
}

function termDir(p, i) {
  const d = labelDir(p, getTerms(p.kind, p.type)[i]);
  return d === 'l' ? [-1, 0] : d === 'r' ? [1, 0] : d === 'u' ? [0, -1] : [0, 1];
}

function hostDir(jid) {
  const j = project.juncs.find((q) => q.id === jid);
  const h = j && wireById(j.w);
  return h ? segDirAt(routeWire(h), (j.d || 0) * G) : null;
}

function legacyRoute(w) {
  if (legacyCache.has(w.id)) return legacyCache.get(w.id);
  legacyCache.set(w.id, []);
  const mk = (e) => {
    if (e.j !== undefined) { const q = juncPos(e.j); return { x: q.x, y: q.y, dir: null, junc: e.j }; }
    const p = partById(e.p);
    if (!p) return { x: 0, y: 0, dir: null };
    const q = termWorld(p, e.t);
    return { x: q.x, y: q.y, dir: termDir(p, e.t) };
  };
  const S = mk(w.a), E = mk(w.b);
  const S1 = S.dir ? { x: S.x + S.dir[0] * G, y: S.y + S.dir[1] * G } : { x: S.x, y: S.y };
  const E1 = E.dir ? { x: E.x + E.dir[0] * G, y: E.y + E.dir[1] * G } : { x: E.x, y: E.y };
  const snap = (v) => Math.round(v / G) * G;
  const mx = snap((S1.x + E1.x) / 2), my = snap((S1.y + E1.y) / 2);
  const mids = [
    [{ x: mx, y: S1.y }, { x: mx, y: E1.y }],
    [{ x: S1.x, y: my }, { x: E1.x, y: my }],
    [{ x: E1.x, y: S1.y }],
    [{ x: S1.x, y: E1.y }]
  ];
  const avoid = E.junc !== undefined ? hostDir(E.junc) : (S.junc !== undefined ? hostDir(S.junc) : null);
  const cands = [];
  mids.forEach((m) => {
    const raw = dedupePts([S, S1].concat(m, [E1, E]));
    if (!pathOk(raw, avoid)) return;
    const pts = mergeCollinear(raw);
    const key = pts.map((q) => q.x + ',' + q.y).join(';');
    if (cands.some((c) => c.key === key)) return;
    cands.push({ pts, key, bends: pts.length - 2, len: pathLen(pts) });
  });
  cands.sort((a, b) => a.bends - b.bends || a.len - b.len);
  let pts;
  if (cands.length) pts = cands[w.flip && cands.length > 1 ? 1 : 0].pts;
  else pts = mergeCollinear(dedupePts([S, S1, { x: E1.x, y: S1.y }, E1, E]));
  legacyCache.set(w.id, pts);
  return pts;
}

function strokePath(c, pts) {
  if (!pts.length) return;
  c.beginPath(); c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
  c.stroke();
}

/* =====================================================================
   Wire router that avoids crossings.
   Wires are laid on the dot grid with 90 degree bends, go around parts
   and around other wires, and never run along the same line as a wire
   of another net. When a crossing cannot be avoided the wire passes
   straight over the other one: the schematic shows a hop and the PCB
   shows a jumper.
   ===================================================================== */
let routes = new Map();          // wire id -> points (board units)
let crossings = [];              // {x, y, ux, uy, hop, other} one per unavoidable crossing
let hopsByWire = new Map();      // wire id -> crossings where that wire hops
let routesSig = null, routesBuilding = false, fastRoute = false;

const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];            // 0 right, 1 down, 2 left, 3 up
const BEND_COST = 4, CROSS_COST = 40;

function dirIndex(v) { return v[0] > 0 ? 0 : v[1] > 0 ? 1 : v[0] < 0 ? 2 : 3; }

function layoutSig() {
  const e = (x) => (x.j !== undefined ? 'j' + x.j : x.p + ':' + x.t);
  return project.parts.map((p) => [p.id, p.kind, p.type, p.x, p.y, p.rot, p.flip ? 1 : 0].join(',')).join(';') +
    '|' + project.wires.map((w) => [w.id, e(w.a), e(w.b), w.flip ? 1 : 0].join(',')).join(';') +
    '|' + project.juncs.map((j) => [j.id, j.w, j.d].join(',')).join(';');
}

function routeWire(w) {
  if (!routesBuilding) ensureRoutes();
  return routes.get(w.id) || [];
}

function ensureRoutes(nt) {
  if (!project) return;
  const sig = layoutSig();
  if (sig === routesSig) return;
  routesSig = sig;
  routeAll(nt || computeNets());
}

// Small binary heap of [priority, value]
function heapPush(h, f, v) {
  h.f.push(f); h.v.push(v);
  let i = h.f.length - 1;
  while (i > 0) {
    const p = (i - 1) >> 1;
    if (h.f[p] <= h.f[i]) break;
    [h.f[p], h.f[i]] = [h.f[i], h.f[p]]; [h.v[p], h.v[i]] = [h.v[i], h.v[p]];
    i = p;
  }
}
function heapPop(h) {
  const top = h.v[0], lf = h.f.pop(), lv = h.v.pop();
  if (h.f.length) {
    h.f[0] = lf; h.v[0] = lv;
    let i = 0;
    for (;;) {
      const l = 2 * i + 1, r = l + 1;
      let m = i;
      if (l < h.f.length && h.f[l] < h.f[m]) m = l;
      if (r < h.f.length && h.f[r] < h.f[m]) m = r;
      if (m === i) break;
      [h.f[m], h.f[i]] = [h.f[i], h.f[m]]; [h.v[m], h.v[i]] = [h.v[i], h.v[m]];
      i = m;
    }
  }
  return top;
}

function routeAll(nt) {
  routes = new Map(); crossings = []; hopsByWire = new Map();
  legacyCache = new Map();
  routesBuilding = true;
  try {
    // Terminals and the nodes that parts occupy
    const termAt = new Map(), blocked = new Set();
    project.parts.forEach((p) => {
      if (p.kind === 'note') return;
      const ts = getTerms(p.kind, p.type);
      ts.forEach((t, i) => {
        const q = termWorld(p, i);
        termAt.set(Math.round(q.x / G) + ',' + Math.round(q.y / G), nt.find('p' + p.id + ':' + i));
      });
      const pts = ts.map((t) => ft(p, t.x, t.y));
      const b = getBox(p.kind, p.type);
      if (b) [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]].forEach((c) => pts.push(ft(p, c[0], c[1])));
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      pts.forEach((q) => { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); });
      for (let x = Math.ceil(x0 - 1e-6); x <= Math.floor(x1 + 1e-6); x++) {
        for (let y = Math.ceil(y0 - 1e-6); y <= Math.floor(y1 + 1e-6); y++) {
          const k = (p.x + x) + ',' + (p.y + y);
          if (!termAt.has(k)) blocked.add(k);
        }
      }
    });
    // terminals are added first, so a second pass fixes parts drawn earlier than later terminals
    termAt.forEach((_, k) => blocked.delete(k));

    // Search area
    let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
    project.parts.forEach((p) => {
      const q = partBounds(p);
      bx0 = Math.min(bx0, Math.floor(q.x0)); by0 = Math.min(by0, Math.floor(q.y0));
      bx1 = Math.max(bx1, Math.ceil(q.x1)); by1 = Math.max(by1, Math.ceil(q.y1));
    });
    if (!isFinite(bx0)) { bx0 = by0 = 0; bx1 = by1 = 1; }
    bx0 -= 5; by0 -= 5; bx1 += 5; by1 += 5;

    let edgeUse = new Map(), nodeUse = new Map();
    const labelCost = new Map();
    project.parts.forEach((p) => {
      if (p.kind === 'note') return;
      const b = partBounds(p);
      const cx = (b.x0 + b.x1) / 2, hw = Math.max(String(p.label).length, String(p.value).length) * 0.3 + 0.4;
      for (let x = Math.ceil(cx - hw); x <= Math.floor(cx + hw); x++) {
        for (let y = Math.ceil(b.y1 + 0.3); y <= Math.floor(b.y1 + 2.3); y++) labelCost.set(x + ',' + y, 5);
      }
    });
    const edgeKey = (x, y, d) => {
      if (d === 0) return 'h' + x + ',' + y;
      if (d === 2) return 'h' + (x - 1) + ',' + y;
      if (d === 1) return 'v' + x + ',' + y;
      return 'v' + x + ',' + (y - 1);
    };
    const perp = (d) => (d % 2 === 0 ? 10 : 5);               // mask of the pair of directions crossing d

    const layout = (order) => {
      edgeUse = new Map(); nodeUse = new Map();
      routes = new Map(); crossings = []; hopsByWire = new Map(); legacyCache = new Map();
      const done = new Set();
      const doWire = (w) => {
        if (done.has(w.id)) return;
        done.add(w.id);
        [w.a, w.b].forEach((e) => {            // a branch wire is routed after the wire it joins
          if (e.j === undefined) return;
          const j = project.juncs.find((q) => q.id === e.j);
          const host = j && wireById(j.w);
          if (host) doWire(host);
        });
        routeOne(w);
      };
      order.forEach(doWire);
      let len = 0;
      routes.forEach((r) => { len += pathLen(r); });
      return { routes, crossings, hopsByWire, len };
    };

    const routeOne = (w) => {
      const mk = (e) => {
        if (e.j !== undefined) {
          const q = juncPos(e.j);
          return { gx: Math.round(q.x / G), gy: Math.round(q.y / G), dir: -1, junc: e.j };
        }
        const p = partById(e.p);
        if (!p) return null;
        const q = termWorld(p, e.t), d = termDir(p, e.t);
        return { gx: Math.round(q.x / G), gy: Math.round(q.y / G), dir: dirIndex(d), junc: undefined };
      };
      let S = mk(w.a), E = mk(w.b), reversed = false;
      if (!S || !E) { routes.set(w.id, []); return; }
      if (S.junc !== undefined && E.junc === undefined) { const t = S; S = E; E = t; reversed = true; }
      const net = nt.find(termKey(w.a));

      let nodes = null;
      if (S.junc === undefined) {
        nodes = searchRoute(S, E, net, w, null);
        if (nodes && w.flip) {
          // "Flip bend": look for a different route by discouraging the first one
          const pen = new Set(nodes.slice(1, -1).map((q) => q[0] + ',' + q[1]));
          const alt = searchRoute(S, E, net, w, pen);
          if (alt) nodes = alt;
        }
      }
      let pts;
      if (nodes) {
        pts = mergeCollinear(nodes.map((q) => ({ x: q[0] * G, y: q[1] * G })));
        commitRoute(w, net, nodes);
      } else {
        pts = legacyRoute(w);
        if (pts.length > 1) {
          const nd = pts.map((q) => [Math.round(q.x / G), Math.round(q.y / G)]);
          const full = [nd[0]];
          for (let i = 1; i < nd.length; i++) {
            let [x, y] = full[full.length - 1];
            const [tx, ty] = nd[i];
            while (x !== tx || y !== ty) { x += Math.sign(tx - x); y += Math.sign(ty - y); full.push([x, y]); }
          }
          commitRoute(w, net, full, true);
        }
        routes.set(w.id, pts);
        return;
      }
      if (reversed) pts = pts.slice().reverse();
      routes.set(w.id, pts);
    };

    const byId = project.wires.slice().sort((a, b) => a.id - b.id);
    let best = layout(byId);
    if (best.crossings.length && !fastRoute) {       // try other orders to reduce crossings
      const span = (w) => { const a = endPos(w.a), b = endPos(w.b); return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); };
      [byId.slice().reverse(), byId.slice().sort((a, b) => span(a) - span(b)), byId.slice().sort((a, b) => span(b) - span(a))].forEach((order) => {
        const r = layout(order);
        if (r.crossings.length < best.crossings.length || (r.crossings.length === best.crossings.length && r.len < best.len - 0.5)) best = r;
      });
    }
    routes = best.routes; crossings = best.crossings; hopsByWire = best.hopsByWire;

    function searchRoute(S, E, net, w, penal) {
      const x0 = Math.min(bx0, S.gx - 3, E.gx - 3), y0 = Math.min(by0, S.gy - 3, E.gy - 3);
      const x1 = Math.max(bx1, S.gx + 3, E.gx + 3), y1 = Math.max(by1, S.gy + 3, E.gy + 3);
      const Wd = x1 - x0 + 1, Hd = y1 - y0 + 1, N = Wd * Hd * 4;
      const sid = (x, y, d) => ((y - y0) * Wd + (x - x0)) * 4 + d;
      const g = new Float32Array(N).fill(1e9), par = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
      const sKey = S.gx + ',' + S.gy, eKey = E.gx + ',' + E.gy;
      const goalDir = E.junc === undefined ? (E.dir + 2) % 4 : -1;
      const avoidAxis = E.junc !== undefined ? (() => { const hd = hostDir(E.junc); return hd ? (Math.abs(hd[0]) > 0.5 ? 0 : 1) : -1; })() : -1;
      const preferEarly = true;
      const heap = { f: [], v: [] };
      const h = (x, y) => Math.abs(x - E.gx) + Math.abs(y - E.gy);

      const foreign = (k) => (nodeUse.get(k) || []).filter((u) => u.net !== net);
      const passable = (x, y, isGoal) => {
        if (x < x0 || x > x1 || y < y0 || y > y1) return false;
        const k = x + ',' + y;
        if (isGoal) return foreign(k).length === 0;
        if (blocked.has(k)) return false;
        if (termAt.has(k) && k !== sKey) return false;
        return true;
      };
      const arriveOk = (d2) => (goalDir >= 0 ? d2 === goalDir : (avoidAxis < 0 || (d2 % 2) !== avoidAxis));

      // first step must leave the terminal in the direction it faces
      const first = S.dir;
      if (first < 0) return null;
      const fx = S.gx + DX[first], fy = S.gy + DY[first];
      const fk = fx + ',' + fy;
      if (fk === eKey) {
        if (!arriveOk(first) || !passable(fx, fy, true)) return null;
        return [[S.gx, S.gy], [fx, fy]];
      }
      if (!passable(fx, fy, false)) return null;
      const ek = edgeUse.get(edgeKey(S.gx, S.gy, first));
      if (ek && ek.net !== net) return null;
      const s0 = sid(fx, fy, first);
      g[s0] = 1; heapPush(heap, 1 + h(fx, fy), s0);

      let found = -1, guard = 0;
      while (heap.f.length && guard++ < 80000) {
        const cur = heapPop(heap);
        if (closed[cur]) continue;
        closed[cur] = 1;
        const d = cur % 4, cell = (cur - d) / 4;
        const x = x0 + (cell % Wd), y = y0 + Math.floor(cell / Wd);
        const key = x + ',' + y;
        const fr = foreign(key);
        for (let d2 = 0; d2 < 4; d2++) {
          if (d2 === (d + 2) % 4) continue;
          let extra = 0;
          if (fr.length) {                                    // passing over another net's wire
            if (d2 !== d || fr.some((u) => u.mask !== perp(d))) continue;
            extra += CROSS_COST;
          }
          const nx = x + DX[d2], ny = y + DY[d2];
          const nk = nx + ',' + ny;
          const eu = edgeUse.get(edgeKey(x, y, d2));
          if (eu && eu.net !== net) continue;                 // never share a line with another net
          const isGoal = nk === eKey;
          if (isGoal && !arriveOk(d2)) continue;
          if (!passable(nx, ny, isGoal)) continue;
          let cost = 1 + extra + (d2 !== d ? BEND_COST : 0) + (eu ? 0.3 : 0) + (labelCost.get(nk) || 0);
          const gc = g[cur];
          // tie-break: normally turn early, "Flip bend" prefers to turn late
          if (d2 !== d) cost += preferEarly ? 0.02 * gc : 0.02 * Math.max(0, 60 - gc);
          if (penal && penal.has(nk) && !isGoal) cost += 6;
          const ns = sid(nx, ny, d2), ng = gc + cost;
          if (ng < g[ns]) {
            g[ns] = ng; par[ns] = cur;
            if (isGoal) { /* keep searching: a cheaper route may still reach the goal */ }
            heapPush(heap, ng + h(nx, ny), ns);
          }
        }
        // stop as soon as the best open state is at the goal
        if (heap.f.length) {
          const top = heap.v[0], td = top % 4, tc = (top - td) / 4;
          if (x0 + (tc % Wd) === E.gx && y0 + Math.floor(tc / Wd) === E.gy) { found = top; break; }
        }
      }
      if (found < 0) {
        for (let d2 = 0; d2 < 4 && found < 0; d2++) {
          const s = sid(E.gx, E.gy, d2);
          if (g[s] < 1e8) found = s;
        }
        if (found < 0) return null;
      }
      const nodes = [];
      let s = found;
      while (s >= 0) {
        const d = s % 4, cell = (s - d) / 4;
        nodes.push([x0 + (cell % Wd), y0 + Math.floor(cell / Wd)]);
        s = par[s];
      }
      nodes.push([S.gx, S.gy]);
      return nodes.reverse();
    }

    function commitRoute(w, net, nodes, legacy) {
      for (let i = 0; i < nodes.length; i++) {
        const [x, y] = nodes[i];
        let mask = 0, ux = 0, uy = 0;
        if (i > 0) {
          const dx = x - nodes[i - 1][0], dy = y - nodes[i - 1][1];
          const bd = dirIndex([dx, dy]);
          mask |= 1 << ((bd + 2) % 4);
          if (i < nodes.length - 1) { ux = dx; uy = dy; }
          const ek = edgeKey(nodes[i - 1][0], nodes[i - 1][1], bd);
          if (!edgeUse.has(ek)) edgeUse.set(ek, { net, wire: w.id });
        }
        let nextDir = -1;
        if (i < nodes.length - 1) {
          nextDir = dirIndex([nodes[i + 1][0] - x, nodes[i + 1][1] - y]);
          mask |= 1 << nextDir;
        }
        const key = x + ',' + y;
        if (!legacy && i > 0 && i < nodes.length - 1) {
          const fr = (nodeUse.get(key) || []).filter((u) => u.net !== net);
          const straight = nextDir >= 0 && dirIndex([x - nodes[i - 1][0], y - nodes[i - 1][1]]) === nextDir;
          if (fr.length && straight && fr.every((u) => u.mask === perp(nextDir))) {
            const c = { x: x * G, y: y * G, ux: DX[nextDir], uy: DY[nextDir], hop: w.id, other: fr[0].wire };
            crossings.push(c);
            if (!hopsByWire.has(w.id)) hopsByWire.set(w.id, []);
            hopsByWire.get(w.id).push(c);
          }
        }
        if (!nodeUse.has(key)) nodeUse.set(key, []);
        nodeUse.get(key).push({ net, wire: w.id, mask });
      }
    }
  } finally {
    routesBuilding = false;
  }
}

// Straight lines with small hops where a wire has to pass over another one
function strokeHopPath(c, pts, hops, r) {
  if (!pts.length) return;
  c.beginPath(); c.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    if (!len) continue;
    const ux = dx / len, uy = dy / len;
    const along = (h) => (h.x - a.x) * ux + (h.y - a.y) * uy;
    hops
      .filter((h) => Math.abs((h.x - a.x) * uy - (h.y - a.y) * ux) < 0.5 && along(h) > r - 0.01 && along(h) < len - r + 0.01)
      .sort((p, q) => along(p) - along(q))
      .forEach((h) => {
        c.lineTo(h.x - ux * r, h.y - uy * r);
        if (ux > 0.5) c.arc(h.x, h.y, r, Math.PI, 0, false);
        else if (ux < -0.5) c.arc(h.x, h.y, r, 0, Math.PI, true);
        else if (uy > 0) c.arc(h.x, h.y, r, -Math.PI / 2, Math.PI / 2, false);
        else c.arc(h.x, h.y, r, Math.PI / 2, -Math.PI / 2, true);
      });
    c.lineTo(b.x, b.y);
  }
  c.stroke();
}

// PCB: the trace is cut around each crossing, and a jumper bridges the gap
function strokeTraceWithGaps(c, pts, hops) {
  if (!hops.length) { strokePath(c, pts); return; }
  const len = pathLen(pts);
  const cuts = hops.map((h) => closestOnPath(pts, h.x, h.y).along).sort((a, b) => a - b);
  let from = 0;
  cuts.forEach((d) => {
    strokePath(c, subPath(pts, from, Math.max(from, d - G)));
    from = Math.min(len, d + G);
  });
  strokePath(c, subPath(pts, from, Infinity));
}

function drawJumpers(c, z) {
  crossings.forEach((x) => {
    const a = { x: x.x - x.ux * G, y: x.y - x.uy * G }, b = { x: x.x + x.ux * G, y: x.y + x.uy * G };
    c.lineCap = 'round';
    c.strokeStyle = '#1b2a3d'; c.lineWidth = 0.52 * G;
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    c.strokeStyle = '#4f78a8'; c.lineWidth = 0.38 * G;
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    c.strokeStyle = '#a9c4e2'; c.lineWidth = 0.1 * G;
    c.beginPath(); c.moveTo(a.x - x.uy * 0.1 * G, a.y + x.ux * 0.1 * G); c.lineTo(b.x - x.uy * 0.1 * G, b.y + x.ux * 0.1 * G); c.stroke();
    [a, b].forEach((q) => {
      c.fillStyle = '#d9b94a'; c.beginPath(); c.arc(q.x, q.y, 0.36 * G, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#3f2f08'; c.beginPath(); c.arc(q.x, q.y, 0.13 * G, 0, Math.PI * 2); c.fill();
    });
  });
}

// Bounds in grid units (absolute)
function partBounds(p) {
  if (p.kind === 'note') {
    const w = Math.max(2, String(p.value || '').length * 0.55);
    return { x0: p.x - w / 2 - 0.3, y0: p.y - 0.8, x1: p.x + w / 2 + 0.3, y1: p.y + 0.8 };
  }
  const pts = getTerms(p.kind, p.type).map((t) => ft(p, t.x, t.y));
  const b = getBox(p.kind, p.type);
  if (b) [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]].forEach((c) => pts.push(ft(p, c[0], c[1])));
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  pts.forEach((q) => { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); });
  const pad = 0.7;
  return { x0: p.x + x0 - pad, y0: p.y + y0 - pad, x1: p.x + x1 + pad, y1: p.y + y1 + pad };
}

function toWorld(sx, sy) { return { x: (sx - view.x) / view.zoom, y: (sy - view.y) / view.zoom }; }

function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = clamp(t, 0, 1);
  return { d: Math.hypot(px - (ax + t * dx), py - (ay + t * dy)), t };
}

/* =====================================================================
   Nets, polarity and short circuits
   ===================================================================== */
const termKey = (e) => (e.j !== undefined ? 'j' + e.j : 'p' + e.p + ':' + e.t);

function computeNets() {
  const parent = new Map();
  const find = (k) => {
    if (!parent.has(k)) parent.set(k, k);
    let r = k;
    while (parent.get(r) !== r) r = parent.get(r);
    let c = k;
    while (parent.get(c) !== r) { const n = parent.get(c); parent.set(c, r); c = n; }
    return r;
  };
  const uni = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent.set(ra, rb); };

  project.wires.forEach((w) => uni(termKey(w.a), termKey(w.b)));
  project.juncs.forEach((j) => {
    const w = wireById(j.w);
    if (w) { uni('j' + j.id, termKey(w.a)); uni('j' + j.id, termKey(w.b)); }
  });

  const plus = new Set(), minus = new Set(), extPlus = new Set(), extMinus = new Set();
  project.parts.forEach((p) => {
    const polCap = p.kind === 'capacitor';
    getTerms(p.kind, p.type).forEach((t, i) => {
      if (!t.pol) return;
      const r = find('p' + p.id + ':' + i);
      (t.pol === '+' ? plus : minus).add(r);
      if (!polCap) (t.pol === '+' ? extPlus : extMinus).add(r);
    });
  });

  const color = new Map(), shorts = new Set();
  new Set([...parent.keys()].map(find)).forEach((r) => {
    const a = plus.has(r), b = minus.has(r);
    if (a && b) shorts.add(r);
    else if (a) color.set(r, '+');
    else if (b) color.set(r, '-');
  });

  // Colour passes through plain two-terminal parts (resistor, inductor, bulb, plain capacitor)
  const pass = project.parts.filter((p) => {
    const ts = getTerms(p.kind, p.type);
    return PASS.has(p.kind) && ts.length === 2 && !ts.some((t) => t.pol);
  });
  const amb = new Set();
  for (let n = 0; n < 60; n++) {
    const cand = new Map();
    pass.forEach((p) => {
      const ra = find('p' + p.id + ':0'), rb = find('p' + p.id + ':1');
      [[ra, rb], [rb, ra]].forEach(([s, d]) => {
        const c = color.get(s);
        if (c && !color.has(d) && !shorts.has(d) && !amb.has(d)) {
          if (!cand.has(d)) cand.set(d, new Set());
          cand.get(d).add(c);
        }
      });
    });
    let changed = false;
    cand.forEach((set, d) => {
      if (set.size === 1) { color.set(d, [...set][0]); changed = true; } else amb.add(d);
    });
    if (!changed) break;
  }
  return { find, color, shorts, extPlus, extMinus };
}

function wireColor(w) {
  const r = nets.find(termKey(w.a));
  if (nets.shorts.has(r)) return C.short;
  const c = nets.color.get(r);
  return c === '+' ? C.red : c === '-' ? C.black : C.gray;
}

/* =====================================================================
   Current flow (yellow arrows)
   Only AC and DC sources drive current. The flow is worked out like a
   resistor network: nets are nodes, parts are links, and the current
   goes from the source's high side to its low side.
   ===================================================================== */
const isOn = (p) => !!(p.on || p.id === heldId);
const isActive = (p) => !!(flow && (flow.active[0].has(p.id) || flow.active[1].has(p.id)));

function partEdges(p) {
  const t = p.type, k = p.kind, e = [];
  const both = (a, b, x) => e.push(Object.assign({ a, b, dir: 'both' }, x));
  switch (k) {
    case 'resistor': both(0, 1); if (t === 'variable') { both(0, 2); both(2, 1); } break;
    case 'inductor': case 'bulb': case 'dc': case 'ac': both(0, 1); break;
    case 'motor': both(0, 1); if (t === 'stepper') both(2, 3); break;
    case 'diode': case 'led': e.push({ a: 0, b: 1, dir: 'ab' }); break;
    case 'capacitor': both(0, 1, { ac: true }); break;
    case 'switch': {
      const on = isOn(p);
      if (t === 'spdt') both(0, on ? 2 : 1); else if (on) both(0, 1);
      break;
    }
    case 'regulator': both(0, 1); break;
    case 'transistor': both(1, 2); if (t === 'npn' || t === 'pnp') both(0, 2); break;
    case 'ic': {
      const ts = getTerms(k, t);
      const pi = ts.findIndex((x) => x.pol === '+'), mi = ts.findIndex((x) => x.pol === '-');
      if (pi >= 0 && mi >= 0) both(pi, mi);
      break;
    }
    case 'relay':
      both(0, 1);
      if (t === 'spdt') both(3, 4); else if (t === 'dpdt') { both(3, 4); both(6, 7); }
      break;
    case 'transformer': {
      const n = getTerms(k, t).length;
      both(0, 1, { ac: true, w: 'P' });
      both(2, n - 1, { ac: true, w: 'S' });
      if (t === 'center') { both(2, 3, { ac: true, w: 'S' }); both(3, n - 1, { ac: true, w: 'S' }); }
      break;
    }
  }
  return e;
}

function computeFlow(nt) {
  const out = { phases: [new Map(), new Map()], active: [new Set(), new Set()], any: false, ac: false, ledWarn: new Set(), segs: [] };
  if (!project || !project.parts.length) return out;
  const root = (p, i) => nt.find('p' + p.id + ':' + i);

  // Wire segments (a wire is split at its junctions) and a spanning forest over them
  const segs = out.segs;
  project.wires.forEach((w) => {
    const js = project.juncs.filter((j) => j.w === w.id).sort((x, y) => x.d - y.d);
    const keys = [termKey(w.a)].concat(js.map((j) => 'j' + j.id), [termKey(w.b)]);
    const ds = [0].concat(js.map((j) => j.d * G), [Infinity]);
    for (let i = 0; i < keys.length - 1; i++) segs.push({ id: segs.length, w, k0: keys[i], k1: keys[i + 1], d0: ds[i], d1: ds[i + 1] });
  });
  const adj = new Map();
  const addAdj = (k, o) => { if (!adj.has(k)) adj.set(k, []); adj.get(k).push(o); };
  segs.forEach((s) => { addAdj(s.k0, { s, to: s.k1 }); addAdj(s.k1, { s, to: s.k0 }); });
  const parent = new Map(), pseg = new Map(), order = [];
  adj.forEach((_, k0) => {
    if (parent.has(k0)) return;
    parent.set(k0, null);
    const q = [k0];
    for (let qi = 0; qi < q.length; qi++) {
      const u = q[qi]; order.push(u);
      adj.get(u).forEach((e) => {
        if (!parent.has(e.to)) { parent.set(e.to, u); pseg.set(e.to, e.s); q.push(e.to); }
      });
    }
  });

  function run(drv, ph) {
    const dp = drv.part;
    const iP = ph === 0 ? drv.from : drv.to, iN = ph === 0 ? drv.to : drv.from;
    const P = root(dp, iP), N = root(dp, iN);
    if (P === N || nt.shorts.has(P) || nt.shorts.has(N)) return null;
    const acMode = drv.kind !== 'dc';

    const edges = [];
    project.parts.forEach((p) => {
      partEdges(p).forEach((e) => {
        if (e.ac && !acMode) return;
        if (p === dp && (drv.kind !== 'tsec' || e.w === 'S')) return;
        const u = root(p, e.a), v = root(p, e.b);
        if (u !== v) edges.push({ u, v, dir: e.dir, p, a: e.a, b: e.b, w: e.w, on: true });
      });
    });

    const solve = () => {
      const par = new Map();
      const f = (x) => {
        if (!par.has(x)) par.set(x, x);
        while (par.get(x) !== x) { par.set(x, par.get(par.get(x))); x = par.get(x); }
        return x;
      };
      edges.forEach((e) => { if (e.on) { const a = f(e.u), b = f(e.v); if (a !== b) par.set(a, b); } });
      if (f(P) !== f(N)) return null;
      const comp = f(P);
      const nodes = new Set();
      edges.forEach((e) => { if (e.on && f(e.u) === comp) { nodes.add(e.u); nodes.add(e.v); } });
      const idx = new Map();
      let m = 0;
      nodes.forEach((n) => { if (n !== P && n !== N) idx.set(n, m++); });
      const A = Array.from({ length: m }, () => new Float64Array(m + 1));
      const fixed = (n) => (n === P ? 1 : 0);
      edges.forEach((e) => {
        if (!e.on || f(e.u) !== comp) return;
        [[e.u, e.v], [e.v, e.u]].forEach(([x, y]) => {
          if (!idx.has(x)) return;
          const i = idx.get(x);
          A[i][i] += 1;
          if (idx.has(y)) A[i][idx.get(y)] -= 1; else A[i][m] += fixed(y);
        });
      });
      for (let c = 0; c < m; c++) {
        let piv = c;
        for (let r = c + 1; r < m; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
        if (Math.abs(A[piv][c]) < 1e-12) continue;
        const tmp = A[c]; A[c] = A[piv]; A[piv] = tmp;
        for (let r = 0; r < m; r++) {
          if (r === c) continue;
          const fct = A[r][c] / A[c][c];
          if (fct) for (let k = c; k <= m; k++) A[r][k] -= fct * A[c][k];
        }
      }
      const phi = new Map([[P, 1], [N, 0]]);
      idx.forEach((i, n) => phi.set(n, A[i][i] ? A[i][m] / A[i][i] : 0));
      return { phi, comp, f };
    };

    // Diodes and LEDs only conduct one way: switch off any that are reverse biased
    let sol = null, changed = true;
    for (let it = 0; it < 8 && changed; it++) {
      sol = solve();
      if (!sol) return null;
      changed = false;
      edges.forEach((e) => {
        if (e.on && e.dir === 'ab' && sol.f(e.u) === sol.comp && sol.phi.get(e.u) < sol.phi.get(e.v) - 1e-9) { e.on = false; changed = true; }
      });
    }
    if (changed) { sol = solve(); if (!sol) return null; }

    const inj = new Map();
    const add = (k, v) => inj.set(k, (inj.get(k) || 0) + v);
    const parts = new Set();
    let I0 = 0;
    edges.forEach((e) => {
      if (!e.on || sol.f(e.u) !== sol.comp) return;
      const I = sol.phi.get(e.u) - sol.phi.get(e.v);
      if (Math.abs(I) < 1e-7) return;
      let from = e.u, to = e.v, ta = e.a, tb = e.b, cur = I;
      if (I < 0) { from = e.v; to = e.u; ta = e.b; tb = e.a; cur = -I; }
      add('p' + e.p.id + ':' + ta, -cur);
      add('p' + e.p.id + ':' + tb, cur);
      parts.add(e.p.id);
      if (e.w) parts.add(e.p.id + ':' + e.w);
      if (from === P) I0 += cur;
      if (to === P) I0 -= cur;
    });
    if (I0 < 1e-7) return null;
    add('p' + dp.id + ':' + iP, I0);
    add('p' + dp.id + ':' + iN, -I0);

    const sum = new Map(), dirs = new Map();
    for (let i = order.length - 1; i >= 0; i--) {
      const k = order[i];
      const sv = (sum.get(k) || 0) + (inj.get(k) || 0);
      const par = parent.get(k);
      if (par !== null && par !== undefined) {
        sum.set(par, (sum.get(par) || 0) + sv);
        if (Math.abs(sv) > 1e-7) {
          const sg = pseg.get(k);
          const fromKey = sv > 0 ? k : par;
          dirs.set(sg.id, fromKey === sg.k0 ? 1 : -1);
        }
      }
    }
    return { dirs, parts };
  }

  const runs = [];
  const merge = (k, r) => {
    r.dirs.forEach((d, id) => {
      const have = out.phases[k].get(id);
      if (have === undefined) out.phases[k].set(id, d); else if (have !== d) out.phases[k].set(id, 0);
    });
    r.parts.forEach((x) => out.active[k].add(x));
  };
  const doRun = (drv, ph) => {
    const r = run(drv, ph);
    if (!r) return;
    (drv.kind === 'dc' ? [0, 1] : [ph]).forEach((k) => merge(k, r));
    runs.push(r);
  };

  project.parts.forEach((p) => {
    if (p.kind === 'dc') doRun({ part: p, kind: 'dc', from: 0, to: 1 }, 0);
    if (p.kind === 'ac') { out.ac = true; doRun({ part: p, kind: 'ac', from: 0, to: 1 }, 0); doRun({ part: p, kind: 'ac', from: 0, to: 1 }, 1); }
  });

  // A transformer whose primary carries current drives its secondary like an AC source
  const done = new Set();
  for (let round = 0; round < 3; round++) {
    let added = false;
    project.parts.forEach((p) => {
      if (p.kind !== 'transformer') return;
      [0, 1].forEach((ph) => {
        const key = p.id + ':' + ph;
        if (done.has(key) || !out.active[ph].has(p.id + ':P')) return;
        done.add(key); added = true; out.ac = true;
        doRun({ part: p, kind: 'tsec', from: 2, to: getTerms(p.kind, p.type).length - 1 }, ph);
      });
    });
    if (!added) break;
  }

  // No arrows on wires that belong to a short circuit
  segs.forEach((s) => {
    if (nt.shorts.has(nt.find(termKey(s.w.a)))) { out.phases[0].delete(s.id); out.phases[1].delete(s.id); }
  });

  // LEDs carrying current with nothing to limit it
  runs.forEach((r) => {
    const ids = [...r.parts].filter((x) => typeof x === 'number');
    const limiter = ids.some((id) => { const q = partById(id); return q && (q.kind === 'resistor' || q.kind === 'bulb' || q.kind === 'motor'); });
    if (!limiter) ids.forEach((id) => { const q = partById(id); if (q && q.kind === 'led') out.ledWarn.add(id); });
  });

  out.any = out.phases[0].size > 0 || out.phases[1].size > 0 || out.active[0].size > 0 || out.active[1].size > 0;
  return out;
}

function glow(c, x, y, r, rgb) {
  c.save();
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(' + rgb + ',.75)');
  g.addColorStop(1, 'rgba(' + rgb + ',0)');

/* =====================================================================

   ===================================================================== */

  if (curFlip) c.scale(-1, 1);
  c.scale(1 / G, 1 / G);
  c.font = '600 ' + (size * G) + 'px system-ui, sans-serif';
  c.textAlign = align || 'center';
  c.textBaseline = 'middle';

  c.restore();

const SYM = {};

SYM.diode = SYM.led = function (c, p) {

SYM.dc = function (c, p) {

SYM.ac = function (c) {
  L(c, [0, -2, 0, -1]); L(c, [0, 1, 0, 2]);

SYM.transformer = function (c, p) {
  L(c, [-2, -2, -0.6, -2, -0.6, -1.5]); L(c, [-2, 2, -0.6, 2, -0.6, 1.5]);

SYM.regulator = function (c, p) {

SYM.bulb = function (c, p) {

SYM.motor = function (c, p) {

SYM.inductor = function (c, p, style) {

SYM.relay = function (c, p) {
  L(c, [-3, -1, -2.5, -1]); L(c, [-3, 1, -2.5, 1]);
  c.beginPath(); c.rect(-2.5, -2, 5, 4); c.fill(); c.stroke();

SYM.ic = function (c, p) {
  const t = p.type;
  if (t === 'opamp') {
    L(c, [-3, -1, -2, -1]); L(c, [-3, 1, -2, 1]); L(c, [2, 0, 3, 0]); L(c, [0, -3, 0, -1]); L(c, [0, 3, 0, 1]);

SYM.transistor = function (c, p) {
  const t = p.type;
  c.save(); c.lineWidth *= 0.5; circle(c, 0.3, 0, 1.7, false); c.restore();

SYM.switch = function (c, p) {

SYM.note = function (c, p) {

function drawSymbol(p) {
  const fn = SYM[p.kind];

}

/* =====================================================================
   Real component look (PCB view). Static, shaded, 3D-looking.
   ===================================================================== */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();

function lgrad(c, x0, y0, x1, y1, stops) {

  stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
  return g;
}
function rgrad(c, x, y, r0, r1, stops) {
  const g = c.createRadialGradient(x, y, r0, x, y, r1);
  stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
  return g;
}

  c.lineCap = 'round';
  getTerms(p.kind, p.type).forEach((t) => {
    let tx, ty;
    if (shape.r) {
      const [x, y, w, h] = shape.r;
      tx = clamp(t.x, x, x + w); ty = clamp(t.y, y, y + h);
      if (tx === t.x && ty === t.y) return;
    } else {
      const [cx, cy, r] = shape.c;
      const dx = t.x - cx, dy = t.y - cy, d = Math.hypot(dx, dy);
      if (d <= r) return;
      tx = cx + dx / d * r * 0.7; ty = cy + dy / d * r * 0.7;
    }
    c.strokeStyle = '#6f7886'; c.lineWidth = 0.26; L(c, [t.x, t.y, tx, ty]);
    c.strokeStyle = '#dfe3e9'; c.lineWidth = 0.1; L(c, [t.x, t.y, tx, ty]);
  });
}
function body(c, fill, rect, r) {
  rr(c, rect[0], rect[1], rect[2], rect[3], r);

}
function disc(c, x, y, r, stops) {
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);

  c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 0.06; c.stroke();
}
function shine(c, x, y, w, h) {
  c.fillStyle = 'rgba(255,255,255,.35)';
  c.beginPath(); c.ellipse(x, y, w, h, 0, 0, Math.PI * 2); c.fill();
}

function drawReal(c, p) {
  const k = p.kind, t = p.type;
  c.lineCap = 'round'; c.lineJoin = 'round';

  if (k === 'resistor') {
    if (t === 'variable') {
      legs(c, p, { r: [-1.5, -1, 3, 2.4] });
      body(c, lgrad(c, 0, -1, 0, 1.4, ['#5aa0e6', '#2f6fba', '#1f4f8c']), [-1.5, -1, 3, 2.4], 0.25);

      c.strokeStyle = '#374151'; c.lineWidth = 0.14; L(c, [-0.45, 0.2, 0.45, 0.2]);
    } else if (t === 'photo') {
      legs(c, p, { c: [0, 0, 1] });
      disc(c, 0, 0, 1, ['#e0b062', '#b77f2b', '#7a4d14']);
      c.strokeStyle = '#4a2f0c'; c.lineWidth = 0.12;
      L(c, [-0.6, -0.45, 0.6, -0.45, -0.6, 0, 0.6, 0, -0.6, 0.45, 0.6, 0.45]);
    } else if (t === 'thermistor') {

      disc(c, 0, 0, 0.9, ['#e07a4a', '#b8410e', '#7a2605']);
      shine(c, -0.3, -0.35, 0.3, 0.18);
    } else {
